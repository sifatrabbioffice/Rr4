      # ── AppIcon Placeholder ────────────────────────────────────────────────
      - name: 🎨 Generate AppIcon Assets
        run: |
          mkdir -p ShadowVillage/Resources/Assets.xcassets/AppIcon.appiconset
          cat > ShadowVillage/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json << 'EOF'
          {
            "images": [
              {"idiom":"universal","platform":"ios","size":"1024x1024","filename":"icon_1024.png","scale":"1x"}
            ],
            "info":{"author":"xcode","version":1}
          }
          EOF
          cat > ShadowVillage/Resources/Assets.xcassets/Contents.json << 'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
          # Generate 1024x1024 icon using Python (dark red horror style)
          python3 << 'PYEOF'
          import struct, zlib, math

          def make_png(w, h):
              def u32(n): return struct.pack('>I', n)
              def chunk(t, d): c = zlib.crc32(t+d)&0xffffffff; return u32(len(d))+t+d+u32(c)
              rows = []
              for y in range(h):
                  row = [0]
                  for x in range(w):
                      cx, cy = x-w//2, y-h//2
                      dist = math.sqrt(cx*cx+cy*cy)
                      # Dark radial gradient background
                      bg_r = max(0, int(20 - dist*0.015))
                      bg_g = max(0, int(3  - dist*0.002))
                      bg_b = max(0, int(3  - dist*0.002))
                      # Blood moon circle
                      moon_dist = math.sqrt((cx-w*0.28)**2 + (cy+h*0.22)**2)
                      if moon_dist < w*0.18:
                          f = 1 - moon_dist/(w*0.18)
                          r = int(180*f + bg_r*(1-f))
                          g = int(20*f  + bg_g*(1-f))
                          b = int(10*f  + bg_b*(1-f))
                      # "S" letter in center
                      elif abs(cx) < w*0.12 and abs(cy) < h*0.20:
                          r,g,b = int(220*0.7), int(10*0.7), int(10*0.7)
                      else:
                          r,g,b = bg_r,bg_g,bg_b
                      row += [min(255,r), min(255,g), min(255,b)]
                  rows.append(bytes(row))
              raw = zlib.compress(b''.join(rows), 9)
              sig = b'\x89PNG\r\n\x1a\n'
              ihdr_d = u32(w)+u32(h)+bytes([8,2,0,0,0])
              return sig+chunk(b'IHDR',ihdr_d)+chunk(b'IDAT',raw)+chunk(b'IEND',b'')

          with open('ShadowVillage/Resources/Assets.xcassets/AppIcon.appiconset/icon_1024.png','wb') as f:
              f.write(make_png(1024,1024))
          print("Icon generated")
          PYEOF

