          import SpriteKit
          class GameOverScene: SKScene {
              let finalScore, finalWave: Int
              let isVictory: Bool
              init(size: CGSize, score: Int, wave: Int, isVictory: Bool = false) {
                  self.finalScore = score; self.finalWave = wave; self.isVictory = isVictory; super.init(size:size)
              }
              required init?(coder: NSCoder) { fatalError() }

              override func didMove(to view: SKView) {
                  backgroundColor = UIColor(red:0.04,green:0.0,blue:0.0,alpha:1)
                  if !isVictory {
                      for _ in 0..<22 {
                          let d = SKShapeNode(rectOf:CGSize(width:CGFloat.random(in:3...8),height:CGFloat.random(in:18...60)),cornerRadius:3)
                          d.fillColor = UIColor(red:0.4,green:0,blue:0,alpha:CGFloat.random(in:0.3...0.7)); d.strokeColor = .clear
                          d.position = CGPoint(x:CGFloat.random(in:0...size.width),y:CGFloat.random(in:0...size.height)); addChild(d)
                      }
                  } else {
                      for _ in 0..<40 {
                          let sp = SKShapeNode(circleOfRadius:CGFloat.random(in:2...6))
                          sp.fillColor = UIColor(hue:CGFloat.random(in:0...1),saturation:0.8,brightness:1,alpha:0.7); sp.strokeColor = .clear
                          sp.position = CGPoint(x:CGFloat.random(in:0...size.width),y:CGFloat.random(in:0...size.height)); addChild(sp)
                          sp.run(SKAction.repeatForever(SKAction.sequence([SKAction.fadeAlpha(to:0.1,duration:CGFloat.random(in:0.4...1.2)),SKAction.fadeAlpha(to:0.9,duration:CGFloat.random(in:0.4...1.2))])))
                      }
                  }
                  let tt = isVictory ? "MISSION COMPLETE" : "YOU DIED"
                  let tc = isVictory ? UIColor(red:1,green:0.82,blue:0,alpha:1) : UIColor(red:0.95,green:0,blue:0,alpha:1)
                  let title = lbl(tt,font:"Courier-Bold",sz:46,color:tc,pos:CGPoint(x:size.width/2,y:size.height*0.73))
                  title.setScale(0.25); addChild(title)
                  title.run(SKAction.sequence([SKAction.scale(to:1.12,duration:0.38),SKAction.scale(to:1.0,duration:0.12)]))
                  let rank: String
                  switch finalScore { case ..<1000:rank="D";case ..<2500:rank="C";case ..<5000:rank="B";case ..<10000:rank="A";default:rank="S" }
                  for (i,s) in ["WAVES SURVIVED : \(finalWave)","FINAL SCORE    : \(finalScore)","RANK           : \(rank)"].enumerated() {
                      let l = lbl(s,font:"Courier",sz:20,color:UIColor(white:0.85,alpha:1),pos:CGPoint(x:size.width/2,y:size.height*0.57-CGFloat(i)*36))
                      l.alpha = 0; l.run(SKAction.sequence([SKAction.wait(forDuration:0.5+Double(i)*0.28),SKAction.fadeIn(withDuration:0.4)])); addChild(l)
                  }
                  for (i,(t,n,fc,sc)) in [("▶  PLAY AGAIN","play_again",UIColor(red:0.55,green:0,blue:0,alpha:0.85),UIColor(red:0.9,green:0.1,blue:0.1,alpha:1)),
                                           ("MAIN MENU","main_menu",UIColor(red:0.12,green:0.04,blue:0.04,alpha:0.85),UIColor(red:0.4,green:0.2,blue:0.2,alpha:0.8))].enumerated() {
                      let yp = size.height*0.35 - CGFloat(i)*60
                      let node = SKNode(); node.name = n; node.position = CGPoint(x:size.width/2,y:yp); node.zPosition = 20; node.alpha = 0
                      let bg = SKShapeNode(rectOf:CGSize(width:220,height:48),cornerRadius:10); bg.fillColor = fc; bg.strokeColor = sc; bg.lineWidth = 2; bg.name = n; node.addChild(bg)
                      let lnode = SKLabelNode(fontNamed:"Courier-Bold"); lnode.text = t; lnode.fontSize = 20; lnode.fontColor = .white; lnode.verticalAlignmentMode = .center; lnode.name = n; node.addChild(lnode)
                      addChild(node); node.run(SKAction.sequence([SKAction.wait(forDuration:1.4+Double(i)*0.5),SKAction.fadeIn(withDuration:0.5)]))
                  }
              }

              private func lbl(_ t: String, font: String, sz: CGFloat, color: UIColor, pos: CGPoint) -> SKLabelNode {
                  let l = SKLabelNode(fontNamed:font); l.text = t; l.fontSize = sz; l.fontColor = color
                  l.position = pos; l.horizontalAlignmentMode = .center; l.verticalAlignmentMode = .center; return l
              }

              override func touchesBegan(_ touches: Set<UITouch>, with e: UIEvent?) {
                  guard let t = touches.first else { return }
                  for n in nodes(at:t.location(in:self)) {
                      let nm = n.name ?? n.parent?.name ?? ""
                      if nm == "play_again" { let g = GameScene(size:size); g.scaleMode = .aspectFill; view?.presentScene(g,transition:.fade(withDuration:1.0)); return }
                      if nm == "main_menu"  { let m = MainMenuScene(size:size); m.scaleMode = .aspectFill; view?.presentScene(m,transition:.fade(withDuration:1.0)); return }
                  }
              }
          }
