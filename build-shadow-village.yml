            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.9 \
            clean build \
            OBJROOT="${{ github.workspace }}/build/obj" \
            SYMROOT="${{ github.workspace }}/build/sym" \
            2>&1 | tee build.log | xcpretty || (cat build.log && exit 1)

      # ── xcpretty install ───────────────────────────────────────────────────
      - name: 📦 Install xcpretty
        run: gem install xcpretty --no-document 2>/dev/null || true

      # ── Package into .ipa ──────────────────────────────────────────────────
      - name: 📦 Package IPA
        run: |
          APP_PATH=$(find ${{ github.workspace }}/build/sym -name "ShadowVillage.app" -type d | head -1)
          echo "App found at: $APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/ShadowVillage.app
          
          # Remove any signing artifacts that cause sideload issues
          rm -rf Payload/ShadowVillage.app/_CodeSignature || true
          codesign --remove-signature Payload/ShadowVillage.app 2>/dev/null || true
          
          # Create IPA
          zip -r ShadowVillage.ipa Payload
          
          echo "✅ IPA created: $(du -sh ShadowVillage.ipa | cut -f1)"
          echo "IPA_PATH=${{ github.workspace }}/ShadowVillage.ipa" >> $GITHUB_ENV

      # ── Upload Artifact ────────────────────────────────────────────────────
      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowVillage-iPhone15ProMax
          path: ShadowVillage.ipa
          retention-days: 30

