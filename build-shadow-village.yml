          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  HOW TO SIDELOAD:                                           ║"
          echo "║  1. Download IPA from Actions > Artifacts                   ║"
          echo "║  2. Install AltStore on your iPhone:                        ║"
          echo "║     https://altstore.io                                     ║"
          echo "║  3. Open AltStore on iPhone > + > Choose IPA                ║"
          echo "║  OR use Sideloadly (Windows/Mac):                           ║"
          echo "║     https://sideloadly.io                                   ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  CONTROLS:                                                  ║"
