      # ── GameScene (MAIN GAME) ──────────────────────────────────────────────
      - name: 📄 Scenes/GameScene.swift
        run: |
          cat > ShadowVillage/Sources/Scenes/GameScene.swift << 'EOF'
          import SpriteKit

          class GameScene: SKScene, SKPhysicsContactDelegate {

              // MARK: – State
              private var player:    PlayerNode!
              private var hud:       HUDNode!
              private var moveJS:    JoystickNode!
              private var aimJS:     JoystickNode!
              private var enemies:   [EnemyNode] = []
              private var wave:      Int = 0
              private var isPaused_: Bool = false

              private let worldNode = SKNode()
              private let mapW: CGFloat = 1800, mapH: CGFloat = 1400

              private var lastUpdate: TimeInterval = 0
              private var waveTimer:  TimeInterval = 0
              private var waveDelay:  TimeInterval = 4.0
              private var waveActive: Bool = false
              private var bossSpawned: Bool = false
              private var gameOver:   Bool = false

              private var shootTouchID: UITouch.Phase? = nil
              private var aimTouch: UITouch? = nil
              private var isAutoShooting = false

              // MARK: – Setup
              override func didMove(to view: SKView) {
                  physicsWorld.gravity = .zero
                  physicsWorld.contactDelegate = self
                  backgroundColor = UIColor(red:0.06,green:0.05,blue:0.02,alpha:1)
                  addChild(worldNode)
                  buildMap()
                  spawnPlayer()
                  setupCamera()
                  setupHUD()
                  setupJoysticks()
                  buildAmbience()
                  waveTimer = waveDelay
                  hud.showMessage("WAVE 1 INCOMING!", color: UIColor(red:1,green:0.2,blue:0.2,alpha:1), duration: 2.5)
              }

              // MARK: – Map
              private func buildMap() {
                  // Ground tiles
                  let tileColors: [UIColor] = [
                      UIColor(red:0.12,green:0.10,blue:0.06,alpha:1),
                      UIColor(red:0.10,green:0.09,blue:0.05,alpha:1),
                      UIColor(red:0.14,green:0.11,blue:0.07,alpha:1)
                  ]
                  let tileS: CGFloat = 90
                  let cols = Int(mapW/tileS)+1, rows = Int(mapH/tileS)+1
                  for r in 0..<rows { for c in 0..<cols {
                      let tile = SKShapeNode(rectOf:CGSize(width:tileS-1,height:tileS-1))
                      tile.fillColor = tileColors[(r+c) % tileColors.count]; tile.strokeColor = UIColor(white:0,alpha:0.15); tile.lineWidth = 1
                      tile.position = CGPoint(x:CGFloat(c)*tileS+tileS/2, y:CGFloat(r)*tileS+tileS/2); tile.zPosition = 0
                      worldNode.addChild(tile)
                  }}
                  // Border walls
                  buildWall(rect:CGRect(x:0,y:-30,width:mapW,height:30))
                  buildWall(rect:CGRect(x:0,y:mapH,width:mapW,height:30))
                  buildWall(rect:CGRect(x:-30,y:0,width:30,height:mapH))
                  buildWall(rect:CGRect(x:mapW,y:0,width:30,height:mapH))
                  // Interior obstacles
                  let obstacles: [(CGFloat,CGFloat,CGFloat,CGFloat)] = [
                      (250,300,120,80),(600,700,80,200),(900,200,200,80),(1200,500,90,300),
                      (400,900,150,90),(700,1100,80,160),(1100,900,200,80),(1400,300,80,220),
                      (1500,1000,140,90),(300,600,90,90),(1000,700,90,90),(800,400,100,60)
                  ]
                  for (x,y,w,h) in obstacles {
                      buildWall(rect:CGRect(x:x,y:y,width:w,height:h))
                      // Dark decal on top
                      let deco = SKShapeNode(rectOf:CGSize(width:w-8,height:h-8),cornerRadius:4)
                      deco.fillColor = UIColor(red:0.08,green:0.06,blue:0.04,alpha:1); deco.strokeColor = .clear
                      deco.position = CGPoint(x:x+w/2,y:y+h/2); deco.zPosition = 1.5; worldNode.addChild(deco)
                  }
                  // Torches (atmospheric lights)
                  let torchPositions: [(CGFloat,CGFloat)] = [(180,180),(900,900),(1600,200),(400,1200),(1300,1100),(800,600)]
                  for (tx,ty) in torchPositions { buildTorch(at:CGPoint(x:tx,y:ty)) }
              }

              private func buildWall(rect r: CGRect) {
                  let wall = SKShapeNode(rectOf:CGSize(width:r.width,height:r.height))
                  wall.fillColor = UIColor(red:0.16,green:0.12,blue:0.08,alpha:1)
                  wall.strokeColor = UIColor(red:0.24,green:0.18,blue:0.10,alpha:1); wall.lineWidth = 2
                  wall.position = CGPoint(x:r.midX,y:r.midY); wall.zPosition = 3
                  wall.physicsBody = SKPhysicsBody(rectangleOf:CGSize(width:r.width,height:r.height))
                  wall.physicsBody?.isDynamic = false; wall.physicsBody?.categoryBitMask = PhysicsCategory.wall
                  wall.physicsBody?.collisionBitMask = PhysicsCategory.player | PhysicsCategory.enemy | PhysicsCategory.boss
                  worldNode.addChild(wall)
              }

              private func buildTorch(at pos: CGPoint) {
                  let stick = SKShapeNode(rectOf:CGSize(width:6,height:22),cornerRadius:2)
                  stick.fillColor = UIColor(red:0.38,green:0.22,blue:0.08,alpha:1); stick.strokeColor = .clear
                  stick.position = pos; stick.zPosition = 4; worldNode.addChild(stick)
                  let flame = SKShapeNode(ellipseOf:CGSize(width:10,height:14))
                  flame.fillColor = UIColor(red:1,green:0.55,blue:0.1,alpha:0.85); flame.strokeColor = .clear
                  flame.position = CGPoint(x:pos.x,y:pos.y+16); flame.zPosition = 5; worldNode.addChild(flame)
                  flame.run(SKAction.repeatForever(SKAction.sequence([
                      SKAction.group([SKAction.scale(to:1.2,duration:0.12),SKAction.fadeAlpha(to:0.65,duration:0.12)]),
                      SKAction.group([SKAction.scale(to:0.85,duration:0.09),SKAction.fadeAlpha(to:0.95,duration:0.09)]),
                      SKAction.group([SKAction.scale(to:1.1,duration:0.10),SKAction.fadeAlpha(to:0.75,duration:0.10)]),
                      SKAction.group([SKAction.scale(to:0.90,duration:0.11),SKAction.fadeAlpha(to:0.85,duration:0.11)])])))
                  let glow = SKShapeNode(circleOfRadius:60)
                  glow.fillColor = UIColor(red:1,green:0.6,blue:0.1,alpha:0.06); glow.strokeColor = .clear
                  glow.position = CGPoint(x:pos.x,y:pos.y+16); glow.zPosition = 3; worldNode.addChild(glow)
              }

              // MARK: – Player Spawn
              private func spawnPlayer() {
                  player = PlayerNode(); player.position = CGPoint(x:mapW/2,y:mapH/2)
                  worldNode.addChild(player)
              }

              // MARK: – Camera
              private func setupCamera() {
                  let cam = SKCameraNode(); camera = cam; addChild(cam)
              }

              // MARK: – HUD
              private func setupHUD() {
                  hud = HUDNode(); hud.setup(size:size); camera?.addChild(hud)
              }

              // MARK: – Joysticks
              private func setupJoysticks() {
                  let jR = size.height * 0.13
                  moveJS = JoystickNode(radius:jR); moveJS.position = CGPoint(x:-size.width/2+jR+24, y:-size.height/2+jR+24)
                  aimJS  = JoystickNode(radius:jR); aimJS.position  = CGPoint(x: size.width/2-jR-24, y:-size.height/2+jR+24)
                  camera?.addChild(moveJS); camera?.addChild(aimJS)
              }

              // MARK: – Ambience
              private func buildAmbience() {
                  // Random grass patches
                  for _ in 0..<60 {
                      let g = SKShapeNode(ellipseOf:CGSize(width:CGFloat.random(in:20...50),height:CGFloat.random(in:10...20)))
                      g.fillColor = UIColor(red:0.08,green:0.12,blue:0.05,alpha:CGFloat.random(in:0.2...0.5)); g.strokeColor = .clear
                      g.position = CGPoint(x:CGFloat.random(in:50...mapW-50),y:CGFloat.random(in:50...mapH-50)); g.zPosition = 1; worldNode.addChild(g)
                  }
              }

              // MARK: – Wave Spawning
              private func spawnWave() {
                  wave += 1; waveActive = true
                  hud.showMessage("⚠ WAVE \(wave) ⚠", color:UIColor(red:1,green:0.2,blue:0.2,alpha:1), duration:2.5)

                  if wave == 5 { spawnBoss(); return }

                  var composition: [EnemyType] = []
                  let extra = max(0, wave-1)
                  for _ in 0..<(3+wave*2+extra) { composition.append(.villager) }
                  for _ in 0..<(wave/2)          { composition.append(.brute) }
                  for _ in 0..<(wave/2)          { composition.append(.fast) }
                  for _ in 0..<(wave > 3 ? 1 : 0){ composition.append(.cultist) }

                  for (i,type) in composition.enumerated() {
                      run(SKAction.sequence([SKAction.wait(forDuration:Double(i)*0.35), SKAction.run { [weak self] in self?.spawnEnemy(type:type) }]))
                  }
                  // Drop ammo crate
                  if wave > 1 { run(SKAction.sequence([SKAction.wait(forDuration:1.0), SKAction.run { [weak self] in self?.dropAmmoCrate() }])) }
              }

              private func spawnEnemy(type: EnemyType) {
                  let e = EnemyNode(type:type)
                  e.position = randomEdgeSpawn(); worldNode.addChild(e); enemies.append(e)
              }

              private func spawnBoss() {
                  bossSpawned = true
                  hud.showMessage("⚠ EL GIGANTE ARRIVES ⚠", color:UIColor(red:1,green:0,blue:0,alpha:1), duration:3.0)
                  let boss = EnemyNode(type:.boss)
                  boss.position = CGPoint(x:mapW*0.15, y:mapH*0.5); worldNode.addChild(boss); enemies.append(boss)
                  // Escort villagers
                  for i in 0..<6 {
                      run(SKAction.sequence([SKAction.wait(forDuration:Double(i)*0.4), SKAction.run { [weak self] in self?.spawnEnemy(type:.villager) }]))
                  }
              }

              private func randomEdgeSpawn() -> CGPoint {
                  let edge = Int.random(in:0...3)
                  let margin: CGFloat = 60
                  switch edge {
                  case 0: return CGPoint(x:CGFloat.random(in:margin...mapW-margin), y:margin)
                  case 1: return CGPoint(x:CGFloat.random(in:margin...mapW-margin), y:mapH-margin)
                  case 2: return CGPoint(x:margin, y:CGFloat.random(in:margin...mapH-margin))
                  default: return CGPoint(x:mapW-margin, y:CGFloat.random(in:margin...mapH-margin))
                  }
              }

              private func dropAmmoCrate() {
                  let x = CGFloat.random(in:200...mapW-200), y = CGFloat.random(in:200...mapH-200)
                  let crate = SKShapeNode(rectOf:CGSize(width:28,height:28),cornerRadius:4)
                  crate.fillColor = UIColor(red:0.7,green:0.5,blue:0.15,alpha:1); crate.strokeColor = UIColor(red:0.9,green:0.7,blue:0.2,alpha:1); crate.lineWidth = 2
                  crate.position = CGPoint(x:x,y:y); crate.zPosition = 6; crate.name = "ammo_crate"
                  let icon = SKLabelNode(fontNamed:"Courier-Bold"); icon.text = "📦"; icon.fontSize = 16; icon.verticalAlignmentMode = .center; icon.name = "ammo_crate"
                  crate.addChild(icon)
                  crate.physicsBody = SKPhysicsBody(rectangleOf:CGSize(width:28,height:28))
                  crate.physicsBody?.categoryBitMask    = PhysicsCategory.item
                  crate.physicsBody?.contactTestBitMask = PhysicsCategory.player
                  crate.physicsBody?.collisionBitMask   = PhysicsCategory.none
                  crate.physicsBody?.isDynamic = false
                  worldNode.addChild(crate)
                  crate.run(SKAction.repeatForever(SKAction.sequence([SKAction.scale(to:1.12,duration:0.6),SKAction.scale(to:0.9,duration:0.6)])))
                  crate.run(SKAction.sequence([SKAction.wait(forDuration:12),SKAction.fadeOut(withDuration:0.5),SKAction.removeFromParent()]))
              }

              private func dropHealthPack(at pos: CGPoint) {
                  let pack = SKShapeNode(circleOfRadius:14)
                  pack.fillColor = UIColor(red:0.8,green:0.0,blue:0.1,alpha:1); pack.strokeColor = UIColor(red:1,green:0.3,blue:0.3,alpha:1); pack.lineWidth = 2
                  pack.position = pos; pack.zPosition = 6; pack.name = "health_pack"
                  let cross = SKLabelNode(fontNamed:"Courier-Bold"); cross.text = "+"; cross.fontSize = 20; cross.fontColor = .white; cross.verticalAlignmentMode = .center; cross.name = "health_pack"
                  pack.addChild(cross)
                  pack.physicsBody = SKPhysicsBody(circleOfRadius:14)
                  pack.physicsBody?.categoryBitMask    = PhysicsCategory.item
                  pack.physicsBody?.contactTestBitMask = PhysicsCategory.player
                  pack.physicsBody?.collisionBitMask   = PhysicsCategory.none; pack.physicsBody?.isDynamic = false
                  worldNode.addChild(pack)
                  pack.run(SKAction.sequence([SKAction.wait(forDuration:10),SKAction.fadeOut(withDuration:0.5),SKAction.removeFromParent()]))
              }

              // MARK: – Touch
              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let locHUD = t.location(in:camera!)
                      for n in nodes(at:locHUD) { if n.name == "swap_btn" { player.nextWeapon(); return } }
                      let locJS = t.location(in:camera!)
                      let mBounds = CGRect(origin:CGPoint(x:moveJS.position.x-moveJS.radius,y:moveJS.position.y-moveJS.radius),
                                           size:CGSize(width:moveJS.radius*2,height:moveJS.radius*2))
                      if mBounds.contains(locJS) && moveJS.trackingTouch == nil { moveJS.trackingTouch = t; continue }
                      let aBounds = CGRect(origin:CGPoint(x:aimJS.position.x-aimJS.radius,y:aimJS.position.y-aimJS.radius),
                                           size:CGSize(width:aimJS.radius*2,height:aimJS.radius*2))
                      if aBounds.contains(locJS) && aimJS.trackingTouch == nil { aimJS.trackingTouch = t; aimTouch = t; isAutoShooting = true; continue }
                      // Tap-to-aim anywhere right side
                      if locHUD.x > 0 { aimTouch = t; isAutoShooting = true }
                  }
              }

              override func touchesMoved(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      let loc = t.location(in:camera!)
                      if t === moveJS.trackingTouch { moveJS.move(to:loc) }
                      if t === aimJS.trackingTouch  { aimJS.move(to:loc); let wl = t.location(in:worldNode); aimAt(worldPt:wl) }
                  }
              }

              override func touchesEnded(_ touches: Set<UITouch>, with event: UIEvent?) {
                  for t in touches {
                      if t === moveJS.trackingTouch { moveJS.reset() }
                      if t === aimJS.trackingTouch  { aimJS.reset(); isAutoShooting = false; aimTouch = nil }
                      if t === aimTouch && t !== aimJS.trackingTouch { isAutoShooting = false; aimTouch = nil }
                  }
              }

              override func touchesCancelled(_ touches: Set<UITouch>, with event: UIEvent?) {
                  touchesEnded(touches, with:event)
              }

              private func aimAt(worldPt pt: CGPoint) {
                  let dx = pt.x - player.position.x, dy = pt.y - player.position.y
                  player.setFacing(angle:atan2(dy,dx))
                  hud.showCrosshair(at:convert(pt,to:camera!))
              }

              // MARK: – Update Loop
              override func update(_ currentTime: TimeInterval) {
                  guard !gameOver, let p = player as PlayerNode?, p.isAlive else { return }
                  let dt = lastUpdate == 0 ? 0 : min(currentTime - lastUpdate, 0.05)
                  lastUpdate = currentTime

                  movePlayer(dt:dt)
                  updateCamera()
                  updateEnemyAI(currentTime:currentTime)
                  updateHUD()
                  updateWaveLogic(dt:dt)
                  if isAutoShooting { player.shoot(in:worldNode) }
              }

              private func movePlayer(dt: TimeInterval) {
                  guard moveJS.isActive else { player.physicsBody?.velocity = .zero; return }
                  let speed: CGFloat = 200
                  let v = moveJS.velocity
                  player.physicsBody?.velocity = CGVector(dx:v.dx*speed, dy:v.dy*speed)
                  player.position.x = max(30, min(mapW-30, player.position.x))
                  player.position.y = max(30, min(mapH-30, player.position.y))
                  // If not using aim joystick, face movement direction
                  if !aimJS.isActive { player.setFacing(angle:atan2(v.dy,v.dx)) }
              }

              private func updateCamera() {
                  let half = CGPoint(x:size.width/2, y:size.height/2)
                  let cx = max(half.x, min(mapW-half.x, player.position.x))
                  let cy = max(half.y, min(mapH-half.y, player.position.y))
                  camera?.position = CGPoint(x:cx, y:cy)
              }

              private func updateEnemyAI(currentTime: TimeInterval) {
                  enemies = enemies.filter{$0.parent != nil && $0.isAlive}
                  for e in enemies {
                      e.moveToward(target:player.position)
                      if e.canAttack(at:currentTime) {
                          let dx = player.position.x-e.position.x, dy = player.position.y-e.position.y
                          if sqrt(dx*dx+dy*dy) < (e.enemyType.radius + 24) {
                              e.lastAttackTime = currentTime
                              player.takeDamage(e.enemyType.damage)
                              screenShake()
                          }
                      }
                  }
              }

              private func updateHUD() {
                  hud.update(health:player.health, maxHealth:player.maxHealth,
                             ammo:player.ammo[player.currentWeapon] ?? 0,
                             totalAmmo:player.totalAmmo[player.currentWeapon] ?? 0,
                             weapon:player.currentWeapon, score:player.score,
                             wave:wave, isReloading:player.isReloading)
                  if !player.isAlive { triggerGameOver(victory:false) }
              }

              private func updateWaveLogic(dt: TimeInterval) {
                  if waveActive {
                      let alive = enemies.filter{$0.isAlive}
                      if alive.isEmpty { waveActive = false; waveTimer = waveDelay
                          if bossSpawned { triggerGameOver(victory:true); return }
                          hud.showMessage("WAVE CLEAR! +500", color:UIColor(red:0.2,green:1,blue:0.2,alpha:1), duration:2.0)
                          player.score += 500
                          if wave % 2 == 0 { dropHealthPack(at:CGPoint(x:mapW/2,y:mapH/2)) }
                      }
                  } else {
                      waveTimer -= dt
                      if waveTimer <= 0 { spawnWave() }
                  }
              }

              // MARK: – Physics Contact
              func didBegin(_ contact: SKPhysicsContact) {
                  let a = contact.bodyA, b = contact.bodyB
                  let aM = a.categoryBitMask, bM = b.categoryBitMask

                  // Bullet hits enemy
                  if (aM == PhysicsCategory.bullet && (bM == PhysicsCategory.enemy || bM == PhysicsCategory.boss)) ||
                     (bM == PhysicsCategory.bullet && (aM == PhysicsCategory.enemy || aM == PhysicsCategory.boss)) {
                      let bullet  = (aM == PhysicsCategory.bullet ? a : b).node as? BulletNode
                      let enemy   = (aM == PhysicsCategory.enemy || aM == PhysicsCategory.boss ? a : b).node as? EnemyNode
                      if let bl = bullet, let en = enemy {
                          bl.removeFromParent(); let died = !en.isAlive
                          en.takeDamage(bl.damage)
                          if !died && !en.isAlive { player.score += en.enemyType.scoreValue; spawnScorePopup(at:en.position, score:en.enemyType.scoreValue) }
                      }
                  }
                  // Bullet hits wall
                  if aM == PhysicsCategory.bullet || bM == PhysicsCategory.bullet {
                      let bullet = (aM == PhysicsCategory.bullet ? a : b).node
                      bullet?.removeFromParent()
                  }
                  // Player picks up item
                  if (aM == PhysicsCategory.player && bM == PhysicsCategory.item) ||
                     (bM == PhysicsCategory.player && aM == PhysicsCategory.item) {
                      let item = (aM == PhysicsCategory.item ? a : b).node
                      if let name = item?.name {
                          if name == "ammo_crate" {
                              player.addAmmo(for:.pistol,  amount:15)
                              player.addAmmo(for:.shotgun, amount:8)
                              player.addAmmo(for:.rifle,   amount:10)
                              player.unlockWeapon(.shotgun); player.unlockWeapon(.rifle)
                              hud.showMessage("AMMO + WEAPON UNLOCKED!", color:UIColor(red:1,green:0.9,blue:0.2,alpha:1), duration:1.8)
                          } else if name == "health_pack" {
                              player.heal(40); hud.showMessage("+ 40 HP", color:UIColor(red:0.2,green:1,blue:0.2,alpha:1), duration:1.5)
                          }
                          item?.removeFromParent()
                      }
                  }
              }

              // MARK: – Helpers
              private func spawnScorePopup(at pos: CGPoint, score: Int) {
                  let l = SKLabelNode(fontNamed:"Courier-Bold"); l.text = "+\(score)"; l.fontSize = 18
                  l.fontColor = UIColor(red:1,green:0.9,blue:0.2,alpha:1); l.position = pos; l.zPosition = 30
                  worldNode.addChild(l)
                  l.run(SKAction.sequence([SKAction.group([SKAction.moveBy(x:0,y:45,duration:0.8),SKAction.fadeOut(withDuration:0.8)]),SKAction.removeFromParent()]))
              }

              private func screenShake() {
                  camera?.removeAction(forKey:"shake")
                  let dur = 0.06, amp: CGFloat = 8
                  camera?.run(SKAction.sequence([
                      SKAction.moveBy(x:amp,y:-amp,duration:dur), SKAction.moveBy(x:-amp,y:amp,duration:dur),
                      SKAction.moveBy(x:amp*0.5,y:amp*0.5,duration:dur), SKAction.moveBy(x:-amp*0.5,y:-amp*0.5,duration:dur)
                  ]), withKey:"shake")
              }

              private func triggerGameOver(victory: Bool) {
                  guard !gameOver else { return }
                  gameOver = true; isPaused_ = true; physicsWorld.speed = 0
                  run(SKAction.sequence([
                      SKAction.wait(forDuration:1.5),
                      SKAction.run { [weak self] in
                          guard let s = self else { return }
                          let go = GameOverScene(size:s.size, score:s.player.score, wave:s.wave, isVictory:victory)
                          go.scaleMode = .aspectFill
                          s.view?.presentScene(go, transition:.fade(withDuration:1.4))
                      }
                  ]))
              }
          }
          EOF

