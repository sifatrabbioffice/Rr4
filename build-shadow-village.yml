name: 🎮 Build Shadow Village – RE4 Horror Game IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-game:
    name: 🏗 Build iOS Game
    runs-on: macos-14

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: 📦 Install XcodeGen
        run: brew install xcodegen

      - name: 📁 Create Directories
        run: |
          mkdir -p ShadowVillage/Sources/Scenes
          mkdir -p ShadowVillage/Sources/Nodes
          mkdir -p ShadowVillage/Resources

      # ── PhysicsCategory ────────────────────────────────────────────────────
      - name: 📄 PhysicsCategory.swift
        run: |
          cat > ShadowVillage/Sources/PhysicsCategory.swift << 'EOF'
          struct PhysicsCategory {
              static let none:   UInt32 = 0
              static let player: UInt32 = 0x1 << 0
              static let enemy:  UInt32 = 0x1 << 1
              static let bullet: UInt32 = 0x1 << 2
              static let wall:   UInt32 = 0x1 << 3
              static let item:   UInt32 = 0x1 << 4
              static let boss:   UInt32 = 0x1 << 5
          }
          EOF

      # ── WeaponType ─────────────────────────────────────────────────────────
      - name: 📄 WeaponType.swift
        run: |
          cat > ShadowVillage/Sources/WeaponType.swift << 'EOF'
          import UIKit
          enum WeaponType: String {
              case pistol = "Handgun", shotgun = "Shotgun", rifle = "Rifle"
              var damage:       CGFloat { switch self { case .pistol: return 25; case .shotgun: return 18; case .rifle: return 80 } }
              var fireRate:     TimeInterval { switch self { case .pistol: return 0.25; case .shotgun: return 0.80; case .rifle: return 0.45 } }
              var ammoCapacity: Int { switch self { case .pistol: return 15; case .shotgun: return 8; case .rifle: return 10 } }
              var bulletSpeed:  CGFloat { switch self { case .pistol: return 620; case .shotgun: return 480; case .rifle: return 950 } }
              var spreadCount:  Int { return self == .shotgun ? 5 : 1 }
              var spread:       CGFloat { return self == .shotgun ? 0.14 : 0 }
              var color: UIColor {
                  switch self {
                  case .pistol:  return UIColor(red:1.0,green:0.9,blue:0.2,alpha:1)
                  case .shotgun: return UIColor(red:1.0,green:0.5,blue:0.1,alpha:1)
                  case .rifle:   return UIColor(red:0.2,green:0.9,blue:1.0,alpha:1)
                  }
              }
          }
          EOF

      # ── EnemyType ──────────────────────────────────────────────────────────
      - name: 📄 EnemyType.swift
        run: |
          cat > ShadowVillage/Sources/EnemyType.swift << 'EOF'
          import UIKit
          enum EnemyType {
              case villager, brute, fast, cultist, boss
              var maxHealth: CGFloat { switch self { case .villager:return 100;case .brute:return 320;case .fast:return 55;case .cultist:return 90;case .boss:return 1200 } }
              var speed:     CGFloat { switch self { case .villager:return 85;case .brute:return 42;case .fast:return 170;case .cultist:return 65;case .boss:return 58 } }
              var damage:    CGFloat { switch self { case .villager:return 15;case .brute:return 38;case .fast:return 10;case .cultist:return 22;case .boss:return 45 } }
              var radius:    CGFloat { switch self { case .villager:return 16;case .brute:return 26;case .fast:return 12;case .cultist:return 15;case .boss:return 42 } }
              var scoreValue: Int    { switch self { case .villager:return 100;case .brute:return 300;case .fast:return 150;case .cultist:return 200;case .boss:return 2500 } }
              var attackInterval: TimeInterval { return self == .boss ? 0.9 : 1.5 }
              var physicsCategory: UInt32 { return self == .boss ? PhysicsCategory.boss : PhysicsCategory.enemy }
              var bodyColor: UIColor {
                  switch self {
                  case .villager: return UIColor(red:0.50,green:0.30,blue:0.20,alpha:1)
                  case .brute:    return UIColor(red:0.42,green:0.14,blue:0.10,alpha:1)
                  case .fast:     return UIColor(red:0.60,green:0.18,blue:0.52,alpha:1)
                  case .cultist:  return UIColor(red:0.28,green:0.00,blue:0.32,alpha:1)
                  case .boss:     return UIColor(red:0.65,green:0.00,blue:0.00,alpha:1)
                  }
              }
          }
          EOF

      # ── AppDelegate ────────────────────────────────────────────────────────
      - name: 📄 AppDelegate.swift
        run: |
          cat > ShadowVillage/Sources/AppDelegate.swift << 'EOF'
          import UIKit
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey:Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = GameViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

      # ── GameViewController ─────────────────────────────────────────────────
      - name: 📄 GameViewController.swift
        run: |
          cat > ShadowVillage/Sources/GameViewController.swift << 'EOF'
          import UIKit, SpriteKit
          class GameViewController: UIViewController {
              override func loadView() { self.view = SKView(frame: UIScreen.main.bounds) }
              override func viewDidLoad() {
                  super.viewDidLoad()
                  guard let sv = view as? SKView else { return }
                  sv.ignoresSiblingOrder = true
                  sv.preferredFramesPerSecond = 60
                  let b = UIScreen.main.bounds
                  let sc = MainMenuScene(size: CGSize(width: max(b.width,b.height), height: min(b.width,b.height)))
                  sc.scaleMode = .aspectFill
                  sv.presentScene(sc)
              }
              override var prefersStatusBarHidden: Bool { true }
              override var shouldAutorotate: Bool { true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { .landscape }
              override var prefersHomeIndicatorAutoHidden: Bool { true }
          }
          EOF

      # ── BulletNode ─────────────────────────────────────────────────────────
      - name: 📄 Nodes/BulletNode.swift
        run: |
          cat > ShadowVillage/Sources/Nodes/BulletNode.swift << 'EOF'
          import SpriteKit
          class BulletNode: SKNode {
              let damage: CGFloat
              let weapon: WeaponType
              init(angle: CGFloat, speed: CGFloat, damage: CGFloat, weapon: WeaponType) {
                  self.damage = damage; self.weapon = weapon
                  super.init()
                  let len: CGFloat = weapon == .rifle ? 14 : 7
                  let wid: CGFloat = weapon == .rifle ? 3 : 4
                  let sh = SKShapeNode(rectOf: CGSize(width:len,height:wid), cornerRadius: wid/2)
                  sh.fillColor = weapon.color; sh.strokeColor = .clear; sh.zRotation = angle
                  addChild(sh)
                  physicsBody = SKPhysicsBody(rectangleOf: CGSize(width:len,height:wid))
                  physicsBody?.categoryBitMask    = PhysicsCategory.bullet
                  physicsBody?.contactTestBitMask = PhysicsCategory.enemy | PhysicsCategory.wall | PhysicsCategory.boss
                  physicsBody?.collisionBitMask   = PhysicsCategory.none
                  physicsBody?.affectedByGravity  = false
                  physicsBody?.linearDamping      = 0
                  physicsBody?.velocity = CGVector(dx:cos(angle)*speed, dy:sin(angle)*speed)
                  zPosition = 8
                  run(SKAction.sequence([SKAction.wait(forDuration:2.2), SKAction.removeFromParent()]))
              }
              required init?(coder: NSCoder) { fatalError() }
          }
          EOF

      # ── JoystickNode ───────────────────────────────────────────────────────
      - name: 📄 Nodes/JoystickNode.swift
        run: |
          cat > ShadowVillage/Sources/Nodes/JoystickNode.swift << 'EOF'
          import SpriteKit
          class JoystickNode: SKNode {
              private var ring, knob: SKShapeNode!
              let radius: CGFloat
              var velocity: CGVector = .zero
              var angle: CGFloat = 0
              var isActive = false
              weak var trackingTouch: UITouch?
              init(radius: CGFloat) {
                  self.radius = radius; super.init()
                  ring = SKShapeNode(circleOfRadius: radius)
                  ring.fillColor = UIColor(white:1,alpha:0.08); ring.strokeColor = UIColor(white:1,alpha:0.28); ring.lineWidth = 2
                  addChild(ring)
                  knob = SKShapeNode(circleOfRadius: radius*0.38)
                  knob.fillColor = UIColor(white:1,alpha:0.32); knob.strokeColor = UIColor(white:1,alpha:0.5); knob.lineWidth = 1.5
                  addChild(knob)
                  alpha = 0.75; zPosition = 100
              }
              required init?(coder: NSCoder) { fatalError() }
              func move(to pt: CGPoint) {
                  let dx = pt.x-position.x, dy = pt.y-position.y
                  let dist = sqrt(dx*dx+dy*dy)
                  let f = dist <= radius ? 1.0 : radius/dist
                  knob.position = CGPoint(x:dx*f, y:dy*f)
                  velocity = CGVector(dx:knob.position.x/radius, dy:knob.position.y/radius)
                  angle = atan2(knob.position.y, knob.position.x)
                  isActive = dist > radius*0.12
              }
              func reset() { knob.position = .zero; velocity = .zero; isActive = false; trackingTouch = nil }
          }
          EOF

      # ── PlayerNode ─────────────────────────────────────────────────────────
      - name: 📄 Nodes/PlayerNode.swift
        run: |
          cat > ShadowVillage/Sources/Nodes/PlayerNode.swift << 'EOF'
          import SpriteKit
          class PlayerNode: SKNode {
              var health: CGFloat = 100, maxHealth: CGFloat = 100
              var isAlive = true, isReloading = false, canShoot = true
              var score = 0
              var currentWeapon: WeaponType = .pistol
              var ammo:      [WeaponType:Int] = [.pistol:15, .shotgun:0, .rifle:0]
              var totalAmmo: [WeaponType:Int] = [.pistol:60, .shotgun:24, .rifle:30]
              var facingAngle: CGFloat = 0
              private var bodyNode: SKShapeNode!
              private let normalColor = UIColor(red:0.20,green:0.48,blue:0.20,alpha:1)
              override init() { super.init(); build() }
              required init?(coder: NSCoder) { fatalError() }

              private func build() {
                  bodyNode = SKShapeNode(circleOfRadius:18)
                  bodyNode.fillColor = normalColor; bodyNode.strokeColor = UIColor(red:0.1,green:0.28,blue:0.1,alpha:1); bodyNode.lineWidth = 2
                  addChild(bodyNode)
                  let head = SKShapeNode(circleOfRadius:7)
                  head.fillColor = UIColor(red:0.78,green:0.58,blue:0.40,alpha:1); head.strokeColor = .clear; head.position = CGPoint(x:0,y:6)
                  addChild(head)
                  let p = CGMutablePath(); p.move(to:CGPoint(x:12,y:0)); p.addLine(to:CGPoint(x:30,y:0))
                  let barrel = SKShapeNode(path:p); barrel.strokeColor = UIColor(white:0.25,alpha:1); barrel.lineWidth = 4; barrel.lineCap = .round
                  addChild(barrel)
                  physicsBody = SKPhysicsBody(circleOfRadius:18)
                  physicsBody?.categoryBitMask    = PhysicsCategory.player
                  physicsBody?.contactTestBitMask = PhysicsCategory.enemy | PhysicsCategory.item | PhysicsCategory.boss
                  physicsBody?.collisionBitMask   = PhysicsCategory.wall
                  physicsBody?.allowsRotation = false; physicsBody?.restitution = 0
                  zPosition = 10
              }

              func setFacing(angle a: CGFloat) { facingAngle = a; zRotation = a }

              func shoot(in scene: SKScene) {
                  guard canShoot, !isReloading else { return }
                  guard let cur = ammo[currentWeapon], cur > 0 else { reloadWeapon(); return }
                  ammo[currentWeapon]! -= 1; canShoot = false
                  run(SKAction.sequence([SKAction.wait(forDuration:currentWeapon.fireRate), SKAction.run { [weak self] in self?.canShoot = true }]))
                  let fp = CGPoint(x:position.x+cos(facingAngle)*32, y:position.y+sin(facingAngle)*32)
                  let flash = SKShapeNode(circleOfRadius:9)
                  flash.fillColor = UIColor(red:1,green:0.85,blue:0.25,alpha:1); flash.strokeColor = .clear; flash.position = fp; flash.zPosition = 15
                  scene.addChild(flash)
                  flash.run(SKAction.sequence([SKAction.group([SKAction.scale(to:1.6,duration:0.04),SKAction.fadeOut(withDuration:0.07)]),SKAction.removeFromParent()]))
                  let rc: CGFloat = 3
                  run(SKAction.sequence([SKAction.move(by:CGVector(dx:-cos(facingAngle)*rc,dy:-sin(facingAngle)*rc),duration:0.04),
                                         SKAction.move(by:CGVector(dx: cos(facingAngle)*rc,dy: sin(facingAngle)*rc),duration:0.06)]))
                  let n = currentWeapon.spreadCount, sp = currentWeapon.spread
                  let start = -sp * CGFloat(n/2)
                  for i in 0..<n {
                      let b = BulletNode(angle:facingAngle+start+sp*CGFloat(i), speed:currentWeapon.bulletSpeed, damage:currentWeapon.damage, weapon:currentWeapon)
                      b.position = fp; scene.addChild(b)
                  }
                  if ammo[currentWeapon]! == 0 { reloadWeapon() }
              }

              func reloadWeapon() {
                  guard !isReloading, let tot = totalAmmo[currentWeapon], tot > 0,
                        let cur = ammo[currentWeapon], cur < currentWeapon.ammoCapacity else { return }
                  isReloading = true; canShoot = false
                  let t: TimeInterval = currentWeapon == .shotgun ? 1.6 : 1.1
                  run(SKAction.sequence([SKAction.wait(forDuration:t), SKAction.run { [weak self] in
                      guard let s = self else { return }
                      let need = s.currentWeapon.ammoCapacity - (s.ammo[s.currentWeapon] ?? 0)
                      let load = min(need, s.totalAmmo[s.currentWeapon] ?? 0)
                      s.ammo[s.currentWeapon]! += load; s.totalAmmo[s.currentWeapon]! -= load
                      s.isReloading = false; s.canShoot = true
                  }]))
              }

              func takeDamage(_ amount: CGFloat) {
                  guard isAlive else { return }; health = max(0, health-amount)
                  run(SKAction.sequence([SKAction.run{[weak self] in self?.bodyNode.fillColor = .red},
                                         SKAction.wait(forDuration:0.15),
                                         SKAction.run{[weak self] in self?.bodyNode.fillColor = self?.normalColor ?? .green}]))
                  if health <= 0 { isAlive = false; physicsBody = nil
                      run(SKAction.sequence([SKAction.group([SKAction.rotate(byAngle:.pi*2,duration:0.45),SKAction.fadeOut(withDuration:0.45)]),SKAction.removeFromParent()]))
                  }
              }

              func heal(_ amount: CGFloat) { health = min(maxHealth, health+amount) }

              func nextWeapon() {
                  let all: [WeaponType] = [.pistol,.shotgun,.rifle]
                  guard let idx = all.firstIndex(of: currentWeapon) else { return }
                  for i in 1...3 {
                      let next = all[(idx+i) % all.count]
                      if (ammo[next] ?? 0) + (totalAmmo[next] ?? 0) > 0 { currentWeapon = next; isReloading = false; canShoot = true; removeAllActions(); return }
                  }
              }
              func addAmmo(for w: WeaponType, amount: Int) { totalAmmo[w, default:0] += amount }
              func unlockWeapon(_ w: WeaponType) { if (ammo[w] ?? 0) == 0 { ammo[w] = w.ammoCapacity } }
          }
          EOF

      # ── EnemyNode ──────────────────────────────────────────────────────────
      - name: 📄 Nodes/EnemyNode.swift
        run: |
          cat > ShadowVillage/Sources/Nodes/EnemyNode.swift << 'EOF'
          import SpriteKit
          class EnemyNode: SKNode {
              let enemyType: EnemyType
              var health: CGFloat
              var isAlive = true
              var lastAttackTime: TimeInterval = 0
              private var bodyNode, healthBar, healthBarBg: SKShapeNode!

              init(type: EnemyType) {
                  self.enemyType = type; self.health = type.maxHealth; super.init(); build()
              }
              required init?(coder: NSCoder) { fatalError() }

              private func build() {
                  let r = enemyType.radius
                  bodyNode = SKShapeNode(circleOfRadius:r)
                  bodyNode.fillColor = enemyType.bodyColor; bodyNode.strokeColor = UIColor(white:0.18,alpha:1); bodyNode.lineWidth = 2
                  addChild(bodyNode)
                  for xm: CGFloat in [-1,1] {
                      let eye = SKShapeNode(circleOfRadius:r*0.17)
                      eye.fillColor = UIColor(red:0.95,green:0.08,blue:0.08,alpha:1); eye.strokeColor = .clear
                      eye.position = CGPoint(x:xm*r*0.33, y:r*0.22); addChild(eye)
                  }
                  if enemyType == .boss {
                      let cp = CGMutablePath()
                      cp.move(to:CGPoint(x:-22,y:r)); cp.addLine(to:CGPoint(x:-11,y:r+18))
                      cp.addLine(to:CGPoint(x:0,y:r+9)); cp.addLine(to:CGPoint(x:11,y:r+18))
                      cp.addLine(to:CGPoint(x:22,y:r))
                      let crown = SKShapeNode(path:cp)
                      crown.strokeColor = UIColor(red:1,green:0.8,blue:0,alpha:1); crown.lineWidth = 3; crown.lineCap = .round
                      addChild(crown)
                      bodyNode.run(SKAction.repeatForever(SKAction.sequence([SKAction.scale(to:1.06,duration:0.5),SKAction.scale(to:0.94,duration:0.5)])))
                  }
                  let bw: CGFloat = r*3
                  healthBarBg = SKShapeNode(rectOf:CGSize(width:bw,height:5),cornerRadius:2)
                  healthBarBg.fillColor = UIColor(red:0.28,green:0,blue:0,alpha:0.85); healthBarBg.strokeColor = .clear
                  healthBarBg.position = CGPoint(x:0,y:r+9); addChild(healthBarBg)
                  healthBar = SKShapeNode(rectOf:CGSize(width:bw,height:5),cornerRadius:2)
                  healthBar.fillColor = UIColor(red:0.8,green:0.08,blue:0.08,alpha:1); healthBar.strokeColor = .clear
                  healthBar.position = CGPoint(x:0,y:r+9); addChild(healthBar)
                  physicsBody = SKPhysicsBody(circleOfRadius:r)
                  physicsBody?.categoryBitMask    = enemyType.physicsCategory
                  physicsBody?.contactTestBitMask = PhysicsCategory.bullet | PhysicsCategory.player
                  physicsBody?.collisionBitMask   = PhysicsCategory.wall | PhysicsCategory.player
                  physicsBody?.allowsRotation = false; physicsBody?.restitution = 0
                  zPosition = 9
              }

              private func refreshBar() {
                  healthBar.removeFromParent()
                  let ratio = max(0.001, health/enemyType.maxHealth)
                  let bw = enemyType.radius*3
                  let nb = SKShapeNode(rectOf:CGSize(width:bw*ratio,height:5),cornerRadius:2)
                  nb.fillColor = ratio > 0.5 ? UIColor(red:0.8,green:0.08,blue:0.08,alpha:1) : UIColor(red:1,green:0.5,blue:0,alpha:1)
                  nb.strokeColor = .clear
                  nb.position = CGPoint(x:-(bw*(1-ratio))/2, y:enemyType.radius+9)
                  healthBar = nb; addChild(healthBar)
              }

              func takeDamage(_ amount: CGFloat) {
                  guard isAlive else { return }; health -= amount; refreshBar()
                  spawnBlood(5)
                  run(SKAction.sequence([SKAction.run{[weak self] in self?.bodyNode.fillColor = .white},
                                         SKAction.wait(forDuration:0.07),
                                         SKAction.run{[weak self] in self?.bodyNode.fillColor = self?.enemyType.bodyColor ?? .red}]))
                  if health <= 0 { isAlive = false; die() }
              }

              private func spawnBlood(_ n: Int) {
                  for _ in 0..<n {
                      let p = SKShapeNode(circleOfRadius:CGFloat.random(in:2...5))
                      p.fillColor = UIColor(red:0.68,green:0,blue:0,alpha:0.9); p.strokeColor = .clear
                      p.position = CGPoint(x:CGFloat.random(in:-10...10),y:CGFloat.random(in:-10...10)); p.zPosition = 13
                      parent?.addChild(p)
                      let a = CGFloat.random(in:0...CGFloat.pi*2), d = CGFloat.random(in:22...55)
                      p.run(SKAction.sequence([SKAction.group([SKAction.move(by:CGVector(dx:cos(a)*d,dy:sin(a)*d),duration:0.28),
                                                               SKAction.fadeOut(withDuration:0.28)]),SKAction.removeFromParent()]))
                  }
              }

              private func die() {
                  removeAllActions(); physicsBody = nil
                  let pool = SKShapeNode(ellipseOf:CGSize(width:enemyType.radius*3.2,height:enemyType.radius*2))
                  pool.fillColor = UIColor(red:0.38,green:0,blue:0,alpha:0.7); pool.strokeColor = .clear
                  pool.position = position; pool.zPosition = 2; parent?.addChild(pool)
                  run(SKAction.sequence([SKAction.group([SKAction.rotate(byAngle:.pi*2,duration:0.38),
                                                         SKAction.scale(to:0.05,duration:0.38),
                                                         SKAction.fadeOut(withDuration:0.38)]),SKAction.removeFromParent()]))
              }

              func moveToward(target: CGPoint) {
                  guard isAlive else { return }
                  let dx = target.x-position.x, dy = target.y-position.y
                  let dist = sqrt(dx*dx+dy*dy)
                  if dist > 6 { physicsBody?.velocity = CGVector(dx:dx/dist*enemyType.speed, dy:dy/dist*enemyType.speed); zRotation = atan2(dy,dx) }
                  else { physicsBody?.velocity = .zero }
              }

              func canAttack(at t: TimeInterval) -> Bool { t - lastAttackTime >= enemyType.attackInterval }
          }
          EOF

      # ── HUDNode ────────────────────────────────────────────────────────────
      - name: 📄 Nodes/HUDNode.swift
        run: |
          cat > ShadowVillage/Sources/Nodes/HUDNode.swift << 'EOF'
          import SpriteKit
          class HUDNode: SKNode {
              private var healthBar, healthBarBg: SKShapeNode!
              private var ammoLabel, weaponLabel, scoreLabel, waveLabel, reloadLabel: SKLabelNode!
              private var crosshair: SKShapeNode!
              let barW: CGFloat = 190
              override init() { super.init(); zPosition = 200 }
              required init?(coder: NSCoder) { fatalError() }

              func setup(size s: CGSize) {
                  let l = -s.width/2, t = s.height/2, r = s.width/2, b = -s.height/2
                  let hpBg = SKShapeNode(rectOf:CGSize(width:barW+4,height:22),cornerRadius:4)
                  hpBg.fillColor = UIColor(white:0,alpha:0.5); hpBg.strokeColor = UIColor(white:1,alpha:0.22)
                  hpBg.position = CGPoint(x:l+barW/2+24,y:t-34); addChild(hpBg)
                  healthBarBg = SKShapeNode(rectOf:CGSize(width:barW,height:16),cornerRadius:3)
                  healthBarBg.fillColor = UIColor(red:0.28,green:0,blue:0,alpha:1); healthBarBg.strokeColor = .clear
                  healthBarBg.position = hpBg.position; addChild(healthBarBg)
                  healthBar = SKShapeNode(rectOf:CGSize(width:barW,height:16),cornerRadius:3)
                  healthBar.fillColor = UIColor(red:0.1,green:0.82,blue:0.1,alpha:1); healthBar.strokeColor = .clear
                  healthBar.position = hpBg.position; addChild(healthBar)
                  let icon = lbl("❤️",sz:13,pos:CGPoint(x:l+13,y:t-40)); addChild(icon)
                  ammoLabel  = lbl("15/60",sz:22,font:"Courier-Bold",pos:CGPoint(x:r-22,y:b+78),align:.right); addChild(ammoLabel)
                  weaponLabel = lbl("[Handgun]",sz:13,pos:CGPoint(x:r-22,y:b+57),color:UIColor(red:1,green:0.8,blue:0.2,alpha:1),align:.right); addChild(weaponLabel)
                  reloadLabel = lbl("RELOADING...",sz:18,font:"Courier-Bold",pos:CGPoint(x:r-22,y:b+100),color:UIColor(red:1,green:0.5,blue:0,alpha:1),align:.right); reloadLabel.isHidden = true; addChild(reloadLabel)
                  scoreLabel = lbl("SCORE: 0",sz:17,font:"Courier-Bold",pos:CGPoint(x:0,y:t-34),color:UIColor(red:1,green:0.9,blue:0.2,alpha:1)); addChild(scoreLabel)
                  waveLabel = lbl("WAVE 1",sz:14,font:"Courier-Bold",pos:CGPoint(x:0,y:t-56),color:UIColor(red:0.9,green:0.2,blue:0.2,alpha:1)); addChild(waveLabel)
                  let cs: CGFloat = 18, cp = CGMutablePath()
                  cp.move(to:CGPoint(x:-cs,y:0)); cp.addLine(to:CGPoint(x:-5,y:0))
                  cp.move(to:CGPoint(x:5,y:0));   cp.addLine(to:CGPoint(x:cs,y:0))
                  cp.move(to:CGPoint(x:0,y:-cs)); cp.addLine(to:CGPoint(x:0,y:-5))
                  cp.move(to:CGPoint(x:0,y:5));   cp.addLine(to:CGPoint(x:0,y:cs))
                  crosshair = SKShapeNode(path:cp)
                  crosshair.strokeColor = UIColor(red:1,green:0.15,blue:0.15,alpha:0.85); crosshair.lineWidth = 1.5; crosshair.isHidden = true
                  addChild(crosshair)
                  let swapN = SKNode(); swapN.name = "swap_btn"; swapN.position = CGPoint(x:r-45,y:b+34); swapN.zPosition = 210
                  let sbg = SKShapeNode(rectOf:CGSize(width:62,height:28),cornerRadius:6)
                  sbg.fillColor = UIColor(red:0.18,green:0.18,blue:0.42,alpha:0.85); sbg.strokeColor = UIColor(white:0.55,alpha:0.45); sbg.lineWidth = 1.2; sbg.name = "swap_btn"
                  swapN.addChild(sbg)
                  let sl = lbl("SWAP",sz:11,font:"Courier-Bold",pos:.zero); sl.name = "swap_btn"; swapN.addChild(sl); addChild(swapN)
              }

              func update(health: CGFloat, maxHealth: CGFloat, ammo: Int, totalAmmo: Int,
                          weapon: WeaponType, score: Int, wave: Int, isReloading: Bool) {
                  let ratio = max(0, health/maxHealth), newW = max(1, barW*ratio)
                  healthBar.removeFromParent()
                  let nb = SKShapeNode(rectOf:CGSize(width:newW,height:16),cornerRadius:3)
                  nb.fillColor = ratio > 0.5 ? UIColor(red:0.10,green:0.82,blue:0.10,alpha:1) : ratio > 0.25 ? UIColor(red:0.90,green:0.60,blue:0,alpha:1) : UIColor(red:0.90,green:0.10,blue:0.10,alpha:1)
                  nb.strokeColor = .clear; nb.position = CGPoint(x:healthBarBg.position.x-(barW-newW)/2, y:healthBarBg.position.y)
                  healthBar = nb; addChild(healthBar)
                  ammoLabel.text = "\(ammo)/\(totalAmmo)"; ammoLabel.fontColor = ammo == 0 ? .red : ammo <= 3 ? .orange : .white
                  weaponLabel.text = "[\(weapon.rawValue)]"; weaponLabel.fontColor = weapon.color
                  scoreLabel.text = "SCORE: \(score)"; waveLabel.text = "WAVE \(wave)"; reloadLabel.isHidden = !isReloading
              }

              func showCrosshair(at pos: CGPoint) { crosshair.position = pos; crosshair.isHidden = false }
              func hideCrosshair() { crosshair.isHidden = true }

              func showMessage(_ text: String, color: UIColor = .white, duration: TimeInterval = 2.0) {
                  let l = SKLabelNode(fontNamed:"Courier-Bold"); l.text = text; l.fontSize = 26; l.fontColor = color
                  l.position = CGPoint(x:0,y:40); l.zPosition = 300; l.setScale(0.4); l.alpha = 0; addChild(l)
                  l.run(SKAction.sequence([SKAction.group([SKAction.scale(to:1.15,duration:0.2),SKAction.fadeIn(withDuration:0.2)]),
                                            SKAction.scale(to:1.0,duration:0.1), SKAction.wait(forDuration:duration-0.5),
                                            SKAction.group([SKAction.fadeOut(withDuration:0.3),SKAction.moveBy(x:0,y:28,duration:0.3)]),
                                            SKAction.removeFromParent()]))
              }

              private func lbl(_ t: String, sz: CGFloat, font: String = "Courier-Bold", pos: CGPoint,
                               color: UIColor = .white, align: SKLabelHorizontalAlignmentMode = .center) -> SKLabelNode {
                  let l = SKLabelNode(fontNamed:font); l.text = t; l.fontSize = sz; l.fontColor = color
                  l.horizontalAlignmentMode = align; l.verticalAlignmentMode = .center; l.position = pos; return l
              }
          }
          EOF

      # ── MainMenuScene ──────────────────────────────────────────────────────
      - name: 📄 Scenes/MainMenuScene.swift
        run: |
          cat > ShadowVillage/Sources/Scenes/MainMenuScene.swift << 'EOF'
          import SpriteKit
          class MainMenuScene: SKScene {
              override func didMove(to view: SKView) {
                  backgroundColor = UIColor(red:0.04,green:0.03,blue:0.02,alpha:1)
                  buildStars(); buildVillage(); buildMoon(); buildFog(); buildTitle(); buildMenu()
              }

              private func buildStars() {
                  for _ in 0..<90 {
                      let s = SKShapeNode(circleOfRadius:CGFloat.random(in:0.5...2))
                      s.fillColor = UIColor(white:CGFloat.random(in:0.4...0.9),alpha:CGFloat.random(in:0.35...0.85)); s.strokeColor = .clear
                      s.position = CGPoint(x:CGFloat.random(in:0...size.width),y:CGFloat.random(in:0...size.height)); addChild(s)
                      s.run(SKAction.repeatForever(SKAction.sequence([
                          SKAction.fadeAlpha(to:CGFloat.random(in:0.08...0.35),duration:CGFloat.random(in:0.6...2.2)),
                          SKAction.fadeAlpha(to:CGFloat.random(in:0.55...1.0),duration:CGFloat.random(in:0.6...2.2))])))
                  }
              }

              private func buildVillage() {
                  let rc = UIColor(red:0.07,green:0.05,blue:0.03,alpha:1), wc = UIColor(red:0.09,green:0.07,blue:0.04,alpha:1)
                  let pos: [(CGFloat,CGFloat,CGFloat)] = [(0.08,90,100),(0.18,70,130),(0.30,110,90),(0.44,80,115),(0.56,95,80),(0.68,75,140),(0.80,100,95),(0.92,65,110)]
                  for (xf,w,h) in pos {
                      let wall = SKShapeNode(rectOf:CGSize(width:w,height:h))
                      wall.fillColor = wc; wall.strokeColor = .clear; wall.position = CGPoint(x:size.width*xf,y:h/2); wall.zPosition = 1; addChild(wall)
                      let rp = CGMutablePath(), rh = CGFloat.random(in:20...48)
                      rp.move(to:CGPoint(x:-(w/2+4),y:0)); rp.addLine(to:CGPoint(x:0,y:rh)); rp.addLine(to:CGPoint(x:w/2+4,y:0)); rp.closeSubpath()
                      let roof = SKShapeNode(path:rp); roof.fillColor = rc; roof.strokeColor = .clear
                      roof.position = CGPoint(x:size.width*xf,y:h); roof.zPosition = 2; addChild(roof)
                      let win = SKShapeNode(rectOf:CGSize(width:12,height:16),cornerRadius:2)
                      win.fillColor = UIColor(red:0.85,green:0.72,blue:0.30,alpha:0.4); win.strokeColor = .clear
                      win.position = CGPoint(x:size.width*xf,y:CGFloat.random(in:20...h*0.6)); win.zPosition = 3; addChild(win)
                      win.run(SKAction.repeatForever(SKAction.sequence([
                          SKAction.fadeAlpha(to:0.15,duration:CGFloat.random(in:0.08...0.3)),
                          SKAction.fadeAlpha(to:CGFloat.random(in:0.3...0.6),duration:CGFloat.random(in:0.06...0.25))])))
                  }
              }

              private func buildMoon() {
                  let moon = SKShapeNode(circleOfRadius:46)
                  moon.fillColor = UIColor(red:0.86,green:0.83,blue:0.70,alpha:1)
                  moon.strokeColor = UIColor(red:1,green:0.96,blue:0.80,alpha:0.30); moon.lineWidth = 4
                  moon.position = CGPoint(x:size.width*0.76,y:size.height*0.78); moon.zPosition = 0; addChild(moon)
                  let glow = SKShapeNode(circleOfRadius:70)
                  glow.fillColor = UIColor(red:1,green:0.95,blue:0.75,alpha:0.06); glow.strokeColor = .clear
                  glow.position = moon.position; addChild(glow)
                  glow.run(SKAction.repeatForever(SKAction.sequence([SKAction.fadeAlpha(to:0.02,duration:1.8),SKAction.fadeAlpha(to:0.10,duration:1.8)])))
                  // Bats
                  for i in 0..<4 {
                      let bat = SKShapeNode(circleOfRadius:4)
                      bat.fillColor = UIColor(white:0.05,alpha:1); bat.strokeColor = .clear
                      bat.position = CGPoint(x:size.width*0.76 + CGFloat(i*20-30), y:size.height*0.78 + 60 + CGFloat(i*15)); bat.zPosition = 5
                      addChild(bat)
                      bat.run(SKAction.repeatForever(SKAction.sequence([
                          SKAction.moveBy(x:CGFloat.random(in:-40...40),y:CGFloat.random(in:-15...25),duration:1.2),
                          SKAction.moveBy(x:CGFloat.random(in:-40...40),y:CGFloat.random(in:-25...15),duration:1.2)])))
                  }
              }

              private func buildFog() {
                  for _ in 0..<8 {
                      let fog = SKShapeNode(ellipseOf:CGSize(width:CGFloat.random(in:180...340),height:CGFloat.random(in:30...70)))
                      fog.fillColor = UIColor(red:0.55,green:0.55,blue:0.65,alpha:CGFloat.random(in:0.04...0.12))
                      fog.strokeColor = .clear
                      fog.position = CGPoint(x:CGFloat.random(in:0...size.width),y:CGFloat.random(in:20...140)); fog.zPosition = 4
                      addChild(fog)
                      let dur = TimeInterval(CGFloat.random(in:6...14))
                      fog.run(SKAction.repeatForever(SKAction.sequence([
                          SKAction.moveBy(x:CGFloat.random(in:-80...80),y:0,duration:dur),
                          SKAction.moveBy(x:CGFloat.random(in:-80...80),y:0,duration:dur)])))
                  }
              }

              private func buildTitle() {
                  let shadow = SKLabelNode(fontNamed:"Courier-Bold")
                  shadow.text = "SHADOW VILLAGE"; shadow.fontSize = 52; shadow.fontColor = UIColor(white:0,alpha:0.7)
                  shadow.position = CGPoint(x:size.width/2+3,y:size.height*0.72-3); shadow.zPosition = 9; addChild(shadow)
                  let title = SKLabelNode(fontNamed:"Courier-Bold")
                  title.text = "SHADOW VILLAGE"; title.fontSize = 52; title.fontColor = UIColor(red:0.9,green:0.08,blue:0.08,alpha:1)
                  title.position = CGPoint(x:size.width/2,y:size.height*0.72); title.zPosition = 10; addChild(title)
                  title.run(SKAction.repeatForever(SKAction.sequence([SKAction.fadeAlpha(to:0.75,duration:1.4),SKAction.fadeAlpha(to:1.0,duration:1.4)])))
                  let sub = SKLabelNode(fontNamed:"Courier"); sub.text = "S U R V I V A L  H O R R O R"; sub.fontSize = 16
                  sub.fontColor = UIColor(red:0.7,green:0.5,blue:0.2,alpha:1)
                  sub.position = CGPoint(x:size.width/2,y:size.height*0.72-42); sub.zPosition = 10; addChild(sub)
              }

              private func buildMenu() {
                  let items: [(String,String,UIColor)] = [
                      ("▶  START GAME","start",UIColor(red:0.55,green:0,blue:0,alpha:0.85)),
                      ("⚙  HOW TO PLAY","how",UIColor(red:0.18,green:0.10,blue:0.04,alpha:0.85)),
                      ("✕  QUIT","quit",UIColor(red:0.12,green:0.04,blue:0.04,alpha:0.85))
                  ]
                  for (i,(title,name,color)) in items.enumerated() {
                      let yp = size.height*0.50 - CGFloat(i)*72
                      let node = SKNode(); node.name = name; node.position = CGPoint(x:size.width/2,y:yp); node.zPosition = 20
                      let bg = SKShapeNode(rectOf:CGSize(width:240,height:52),cornerRadius:10)
                      bg.fillColor = color; bg.strokeColor = UIColor(red:0.75,green:0.15,blue:0.15,alpha:0.8); bg.lineWidth = 2; bg.name = name
                      node.addChild(bg)
                      let lbl = SKLabelNode(fontNamed:"Courier-Bold"); lbl.text = title; lbl.fontSize = 21; lbl.fontColor = .white
                      lbl.verticalAlignmentMode = .center; lbl.name = name; node.addChild(lbl)
                      node.alpha = 0; addChild(node)
                      node.run(SKAction.sequence([SKAction.wait(forDuration:0.3+Double(i)*0.15),SKAction.fadeIn(withDuration:0.4)]))
                  }
              }

              override func touchesBegan(_ touches: Set<UITouch>, with e: UIEvent?) {
                  guard let t = touches.first else { return }
                  for n in nodes(at:t.location(in:self)) {
                      let nm = n.name ?? n.parent?.name ?? ""
                      if nm == "start" { let g = GameScene(size:size); g.scaleMode = .aspectFill; view?.presentScene(g,transition:.fade(withDuration:1.2)); return }
                      if nm == "how" { showHelp(); return }
                      if nm == "quit" { UIApplication.shared.perform(#selector(NSXPCConnection.suspend)); return }
                  }
              }

              private func showHelp() {
                  let ov = SKShapeNode(rectOf:size); ov.fillColor = UIColor(white:0,alpha:0.88); ov.strokeColor = .clear
                  ov.position = CGPoint(x:size.width/2,y:size.height/2); ov.zPosition = 50; ov.name = "overlay"; addChild(ov)
                  let lines = ["HOW TO PLAY","","LEFT JOYSTICK – Move","RIGHT SIDE TAP – Shoot","SHOOT BUTTON – Fire","SWAP button – Change weapon","","Survive the waves!","Kill the boss to win!","","TAP to close"]
                  for (i,line) in lines.enumerated() {
                      let l = SKLabelNode(fontNamed: i==0 ? "Courier-Bold" : "Courier")
                      l.text = line; l.fontSize = i==0 ? 24 : 16
                      l.fontColor = i==0 ? UIColor(red:1,green:0.8,blue:0.2,alpha:1) : .white
                      l.position = CGPoint(x:size.width/2,y:size.height*0.82-CGFloat(i)*30); l.zPosition = 51; l.name = "overlay"; addChild(l)
                  }
              }

              override func touchesEnded(_ touches: Set<UITouch>, with e: UIEvent?) {
                  if nodes(at:touches.first?.location(in:self) ?? .zero).contains(where:{$0.name=="overlay"}) {
                      children.filter{$0.name=="overlay"}.forEach{$0.removeFromParent()}
                  }
              }
          }
