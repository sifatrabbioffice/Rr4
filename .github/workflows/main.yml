      - name: 📄 Write Scenes/GameOverScene.swift
        run: |
          cat << 'SWIFT_EOF' > ShadowVillage/Sources/Scenes/GameOverScene.swift
          import SpriteKit

          class GameOverScene: SKScene {
              let finalScore: Int
              let finalWave:  Int
              let isVictory:  Bool

              init(size: CGSize, score: Int, wave: Int, isVictory: Bool = false) {
                  self.finalScore = score
                  self.finalWave  = wave
                  self.isVictory  = isVictory
                  super.init(size: size)
              }
              required init?(coder: NSCoder) { fatalError() }

              override func didMove(to view: SKView) {
                  backgroundColor = UIColor(red: 0.04, green: 0.0, blue: 0.0, alpha: 1)
                  buildUI()
              }

              private func buildUI() {
                  // Background blood drops
                  if !isVictory {
                      for _ in 0..<22 {
                          let d = SKShapeNode(rectOf: CGSize(width: CGFloat.random(in: 3...8),
                                                             height: CGFloat.random(in: 18...60)),
                                             cornerRadius: 3)
                          d.fillColor   = UIColor(red: 0.4, green: 0, blue: 0, alpha: CGFloat.random(in: 0.3...0.7))
                          d.strokeColor = .clear
                          d.position    = CGPoint(x: CGFloat.random(in: 0...size.width),
                                                  y: CGFloat.random(in: 0...size.height))
                          addChild(d)
                      }
                  } else {
                      // Victory sparkles
                      for _ in 0..<40 {
                          let sp = SKShapeNode(circleOfRadius: CGFloat.random(in: 2...6))
                          sp.fillColor   = UIColor(hue: CGFloat.random(in: 0...1), saturation: 0.8, brightness: 1, alpha: 0.7)
                          sp.strokeColor = .clear
                          sp.position    = CGPoint(x: CGFloat.random(in: 0...size.width),
                                                   y: CGFloat.random(in: 0...size.height))
                          addChild(sp)
                          sp.run(SKAction.repeatForever(SKAction.sequence([
                              SKAction.fadeAlpha(to: 0.1, duration: CGFloat.random(in: 0.4...1.2)),
                              SKAction.fadeAlpha(to: 0.9, duration: CGFloat.random(in: 0.4...1.2))
                          ])))
                      }
                  }

                  let titleText  = isVictory ? "MISSION COMPLETE" : "YOU DIED"
                  let titleColor = isVictory
                      ? UIColor(red: 1, green: 0.82, blue: 0, alpha: 1)
                      : UIColor(red: 0.95, green: 0, blue: 0, alpha: 1)

                  let title = label(titleText, font: "Courier-Bold", sz: 46, color: titleColor,
                                    pos: CGPoint(x: size.width/2, y: size.height * 0.73))
                  title.setScale(0.25)
                  addChild(title)
                  title.run(SKAction.sequence([
                      SKAction.scale(to: 1.12, duration: 0.38),
                      SKAction.scale(to: 1.00, duration: 0.12)
                  ]))

                  let stats: [String] = [
                      "WAVES SURVIVED : \(finalWave)",
                      "FINAL SCORE    : \(finalScore)",
                      "RANK           : \(rank(for: finalScore))"
                  ]
                  for (i, s) in stats.enumerated() {
                      let l = label(s, font: "Courier", sz: 20, color: UIColor(white: 0.85, alpha: 1),
                                    pos: CGPoint(x: size.width/2, y: size.height * 0.57 - CGFloat(i) * 36))
                      l.alpha = 0
                      l.run(SKAction.sequence([
                          SKAction.wait(forDuration: 0.5 + Double(i) * 0.28),
                          SKAction.fadeIn(withDuration: 0.4)
                      ]))
                      addChild(l)
                  }

                  // Play Again
                  let pa = button("▶  PLAY AGAIN",
                                  pos: CGPoint(x: size.width/2, y: size.height * 0.35),
                                  name: "play_again",
                                  fillColor: UIColor(red: 0.55, green: 0, blue: 0, alpha: 0.85),
                                  strokeColor: UIColor(red: 0.9, green: 0.1, blue: 0.1, alpha: 1))
                  pa.alpha = 0
                  pa.run(SKAction.sequence([
                      SKAction.wait(forDuration: 1.4),
                      SKAction.fadeIn(withDuration: 0.5),
                      SKAction.repeatForever(SKAction.sequence([
                          SKAction.scale(to: 1.04, duration: 0.65),
                          SKAction.scale(to: 0.96, duration: 0.65)
                      ]))
                  ]))
                  addChild(pa)

                  // Menu
                  let mn = button("MAIN MENU",
                                  pos: CGPoint(x: size.width/2, y: size.height * 0.35 - 60),
                                  name: "main_menu",
                                  fillColor: UIColor(red: 0.12, green: 0.04, blue: 0.04, alpha: 0.85),
                                  strokeColor: UIColor(red: 0.4, green: 0.2, blue: 0.2, alpha: 0.8))
                  mn.alpha = 0
                  mn.run(SKAction.sequence([
                      SKAction.wait(forDuration: 1.9),
                      SKAction.fadeIn(withDuration: 0.4)
                  ]))
                  addChild(mn)
              }

              private func rank(for score: Int) -> String {
                  switch score {
                  case ..<1000:   return "D"
                  case ..<2500:   return "C"
                  case ..<5000:   return "B"
                  case ..<10000:  return "A"
                  default:        return "S"
                  }
              }

              private func label(_ text: String, font: String, sz: CGFloat, color: UIColor,
                                  pos: CGPoint) -> SKLabelNode {
                  let l = SKLabelNode(fontNamed: font)
                  l.text = text; l.fontSize = sz; l.fontColor = color; l.position = pos
                  l.horizontalAlignmentMode = .center; l.verticalAlignmentMode = .center
                  return l
              }

              private func button(_ title: String, pos: CGPoint, name: String,
                                  fillColor: UIColor, strokeColor: UIColor) -> SKNode {
                  let node = SKNode(); node.name = name; node.position = pos
                  let bg = SKShapeNode(rectOf: CGSize(width: 220, height: 48), cornerRadius: 10)
                  bg.fillColor = fillColor; bg.strokeColor = strokeColor; bg.lineWidth = 2
                  bg.name = name; node.addChild(bg)
                  let l = SKLabelNode(fontNamed: "Courier-Bold")
                  l.text = title; l.fontSize = 20; l.fontColor = .white
                  l.verticalAlignmentMode = .center; l.name = name; node.addChild(l)
                  return node
              }

              override func touchesBegan(_ touches: Set<UITouch>, with event: UIEvent?) {
                  guard let touch = touches.first else { return }
                  for node in nodes(at: touch.location(in: self)) {
                      let n = node.name ?? node.parent?.name ?? ""
                      if n == "play_again" {
                          let sc = GameScene(size: size); sc.scaleMode = .aspectFill
                          view?.presentScene(sc, transition: .fade(withDuration: 1.0)); return
                      } else if n == "main_menu" {
                          let sc = MainMenuScene(size: size); sc.scaleMode = .aspectFill
                          view?.presentScene(sc, transition: .fade(withDuration: 1.0)); return
                      }
                  }
              }
          }
          SWIFT_EOF

