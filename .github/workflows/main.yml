      - name: 📄 Write Nodes/BulletNode.swift
        run: |
          cat << 'SWIFT_EOF' > ShadowVillage/Sources/Nodes/BulletNode.swift
          import SpriteKit

          class BulletNode: SKNode {
              let damage: CGFloat
              let weapon: WeaponType

              init(angle: CGFloat, speed: CGFloat, damage: CGFloat, weapon: WeaponType) {
                  self.damage = damage
                  self.weapon = weapon
                  super.init()

                  let length: CGFloat = weapon == .rifle ? 14 : 7
                  let width:  CGFloat = weapon == .rifle ?  3 : 4

                  let shape = SKShapeNode(rectOf: CGSize(width: length, height: width), cornerRadius: width / 2)
                  shape.fillColor   = weapon.color
                  shape.strokeColor = .clear
                  shape.zRotation   = angle
                  addChild(shape)

                  physicsBody = SKPhysicsBody(rectangleOf: CGSize(width: length, height: width))
                  physicsBody?.categoryBitMask    = PhysicsCategory.bullet
                  physicsBody?.contactTestBitMask = PhysicsCategory.enemy | PhysicsCategory.wall | PhysicsCategory.boss
                  physicsBody?.collisionBitMask   = PhysicsCategory.none
                  physicsBody?.isDynamic         = true
                  physicsBody?.affectedByGravity = false
                  physicsBody?.allowsRotation    = false
                  physicsBody?.linearDamping     = 0
                  physicsBody?.velocity          = CGVector(dx: cos(angle) * speed, dy: sin(angle) * speed)

                  zPosition = 8

                  run(SKAction.sequence([
                      SKAction.wait(forDuration: 2.2),
                      SKAction.removeFromParent()
                  ]))
              }

              required init?(coder: NSCoder) { fatalError() }
          }
          SWIFT_EOF

      - name: 📄 Write Nodes/JoystickNode.swift
        run: |
          cat << 'SWIFT_EOF' > ShadowVillage/Sources/Nodes/JoystickNode.swift
          import SpriteKit

          class JoystickNode: SKNode {
              private var ring:  SKShapeNode!
              private var knob:  SKShapeNode!
              let radius: CGFloat
              var velocity: CGVector = .zero
              var angle:    CGFloat  = 0
              var isActive: Bool     = false
              weak var trackingTouch: UITouch?

              init(radius: CGFloat) {
                  self.radius = radius
                  super.init()

                  ring = SKShapeNode(circleOfRadius: radius)
                  ring.fillColor   = UIColor(white: 1, alpha: 0.08)
                  ring.strokeColor = UIColor(white: 1, alpha: 0.28)
                  ring.lineWidth   = 2
                  addChild(ring)

                  knob = SKShapeNode(circleOfRadius: radius * 0.38)
                  knob.fillColor   = UIColor(white: 1, alpha: 0.32)
                  knob.strokeColor = UIColor(white: 1, alpha: 0.5)
                  knob.lineWidth   = 1.5
                  addChild(knob)

                  alpha     = 0.75
                  zPosition = 100
              }

              required init?(coder: NSCoder) { fatalError() }

              func move(to point: CGPoint) {
                  let dx = point.x - position.x
                  let dy = point.y - position.y
                  let dist = sqrt(dx * dx + dy * dy)
                  if dist <= radius {
                      knob.position = CGPoint(x: dx, y: dy)
                  } else {
                      let f = radius / dist
                      knob.position = CGPoint(x: dx * f, y: dy * f)
                  }
                  velocity  = CGVector(dx: knob.position.x / radius, dy: knob.position.y / radius)
                  angle     = atan2(knob.position.y, knob.position.x)
                  isActive  = dist > radius * 0.12
              }

              func reset() {
                  knob.position  = .zero
                  velocity       = .zero
                  isActive       = false
                  trackingTouch  = nil
              }
          }
          SWIFT_EOF

      - name: 📄 Write Nodes/PlayerNode.swift
        run: |
          cat << 'SWIFT_EOF' > ShadowVillage/Sources/Nodes/PlayerNode.swift
          import SpriteKit

          class PlayerNode: SKNode {
              var health:    CGFloat = 100
              var maxHealth: CGFloat = 100
              var isAlive:   Bool    = true
              var isReloading: Bool  = false
              var canShoot:  Bool    = true
              var score:     Int     = 0

              var currentWeapon: WeaponType = .pistol
              var ammo:      [WeaponType: Int] = [.pistol: 15, .shotgun: 0, .rifle: 0]
              var totalAmmo: [WeaponType: Int] = [.pistol: 60, .shotgun: 24, .rifle: 30]

              var facingAngle: CGFloat = 0

              private var bodyNode:      SKShapeNode!
              private var headNode:      SKShapeNode!
              private var barrelNode:    SKShapeNode!
              private let bodyNormalColor = UIColor(red: 0.20, green: 0.48, blue: 0.20, alpha: 1)

              override init() {
                  super.init()
                  buildVisuals()
              }
              required init?(coder: NSCoder) { fatalError() }

              // MARK: – Visuals
              private func buildVisuals() {
                  // Body
                  bodyNode = SKShapeNode(circleOfRadius: 18)
                  bodyNode.fillColor   = bodyNormalColor
                  bodyNode.strokeColor = UIColor(red: 0.10, green: 0.28, blue: 0.10, alpha: 1)
                  bodyNode.lineWidth   = 2
                  addChild(bodyNode)

                  // Head
                  headNode = SKShapeNode(circleOfRadius: 7)
                  headNode.fillColor   = UIColor(red: 0.78, green: 0.58, blue: 0.40, alpha: 1)
                  headNode.strokeColor = .clear
                  headNode.position    = CGPoint(x: 0, y: 6)
                  addChild(headNode)

                  // Gun barrel direction
                  let path = CGMutablePath()
                  path.move(to: CGPoint(x: 12, y: 0))
                  path.addLine(to: CGPoint(x: 30, y: 0))
                  barrelNode = SKShapeNode(path: path)
                  barrelNode.strokeColor = UIColor(white: 0.25, alpha: 1)
                  barrelNode.lineWidth   = 4
                  barrelNode.lineCap     = .round
                  addChild(barrelNode)

                  // Physics
                  physicsBody = SKPhysicsBody(circleOfRadius: 18)
                  physicsBody?.categoryBitMask    = PhysicsCategory.player
                  physicsBody?.contactTestBitMask = PhysicsCategory.enemy | PhysicsCategory.item | PhysicsCategory.boss
                  physicsBody?.collisionBitMask   = PhysicsCategory.wall
                  physicsBody?.allowsRotation     = false
                  physicsBody?.restitution        = 0
                  physicsBody?.friction           = 1

                  zPosition = 10
              }

              // MARK: – Facing
              func setFacing(angle: CGFloat) {
                  facingAngle    = angle
                  zRotation      = angle
              }

              // MARK: – Shoot
              func shoot(in scene: SKScene) {
                  guard canShoot, !isReloading else { return }
                  guard let cur = ammo[currentWeapon], cur > 0 else {
                      reloadWeapon(); return
                  }
                  ammo[currentWeapon]! -= 1
                  canShoot = false

                  run(SKAction.sequence([
                      SKAction.wait(forDuration: currentWeapon.fireRate),
                      SKAction.run { [weak self] in self?.canShoot = true }
                  ]))

                  // Muzzle flash
                  let flashPos = CGPoint(x: position.x + cos(facingAngle) * 32,
                                        y: position.y + sin(facingAngle) * 32)
                  let flash = SKShapeNode(circleOfRadius: 9)
                  flash.fillColor   = UIColor(red: 1, green: 0.85, blue: 0.25, alpha: 1)
                  flash.strokeColor = .clear
                  flash.position    = flashPos
                  flash.zPosition   = 15
                  scene.addChild(flash)
                  flash.run(SKAction.sequence([
                      SKAction.group([SKAction.scale(to: 1.6, duration: 0.04),
                                      SKAction.fadeOut(withDuration: 0.07)]),
                      SKAction.removeFromParent()
                  ]))

                  // Recoil
                  let rc: CGFloat = 3
                  run(SKAction.sequence([
                      SKAction.move(by: CGVector(dx: -cos(facingAngle)*rc, dy: -sin(facingAngle)*rc), duration: 0.04),
                      SKAction.move(by: CGVector(dx:  cos(facingAngle)*rc, dy:  sin(facingAngle)*rc), duration: 0.06)
                  ]))

                  // Spawn bullets
                  let count   = currentWeapon.spreadCount
                  let spread  = currentWeapon == .shotgun ? 0.14 : 0.0
                  let start   = -spread * CGFloat(count / 2)
                  for i in 0..<count {
                      let a = facingAngle + start + spread * CGFloat(i)
                      let b = BulletNode(angle: a,
                                         speed: currentWeapon.bulletSpeed,
                                         damage: currentWeapon.damage,
                                         weapon: currentWeapon)
                      b.position = flashPos
                      scene.addChild(b)
                  }

                  if ammo[currentWeapon]! == 0 { reloadWeapon() }
              }

              // MARK: – Reload
              func reloadWeapon() {
                  guard !isReloading else { return }
                  guard let total = totalAmmo[currentWeapon], total > 0 else { return }
                  guard let cur   = ammo[currentWeapon], cur < currentWeapon.ammoCapacity else { return }
                  isReloading = true
                  canShoot    = false
                  let reloadTime: TimeInterval = currentWeapon == .shotgun ? 1.6 : 1.1
                  run(SKAction.sequence([
                      SKAction.wait(forDuration: reloadTime),
                      SKAction.run { [weak self] in
                          guard let s = self else { return }
                          let needed    = s.currentWeapon.ammoCapacity - (s.ammo[s.currentWeapon] ?? 0)
                          let available = s.totalAmmo[s.currentWeapon] ?? 0
                          let load      = min(needed, available)
                          s.ammo[s.currentWeapon]!      += load
                          s.totalAmmo[s.currentWeapon]! -= load
                          s.isReloading = false
                          s.canShoot    = true
                      }
                  ]))
              }

              // MARK: – Damage / Heal
              func takeDamage(_ amount: CGFloat) {
                  guard isAlive else { return }
                  health = max(0, health - amount)
                  run(SKAction.sequence([
                      SKAction.run { [weak self] in self?.bodyNode.fillColor = .red },
                      SKAction.wait(forDuration: 0.15),
                      SKAction.run { [weak self] in self?.bodyNode.fillColor = self?.bodyNormalColor ?? .green }
                  ]))
                  if health <= 0 { isAlive = false; animateDeath() }
              }

              func heal(_ amount: CGFloat) {
                  health = min(maxHealth, health + amount)
                  run(SKAction.sequence([
                      SKAction.run { [weak self] in self?.bodyNode.fillColor = UIColor(red: 0.2, green: 1, blue: 0.2, alpha: 1) },
                      SKAction.wait(forDuration: 0.20),
                      SKAction.run { [weak self] in self?.bodyNode.fillColor = self?.bodyNormalColor ?? .green }
                  ]))
              }

              // MARK: – Weapon Switch
              func nextWeapon() {
                  let all: [WeaponType] = [.pistol, .shotgun, .rifle]
                  let idx  = (all.firstIndex(of: currentWeapon) ?? 0 + 1) % all.count
                  let next = all[idx]
                  let hasAmmo = (ammo[next] ?? 0) + (totalAmmo[next] ?? 0) > 0
                  if hasAmmo {
                      currentWeapon = next
                      isReloading   = false
                      canShoot      = true
                      removeAllActions()
                  }
              }

              func addAmmo(for weapon: WeaponType, amount: Int) {
                  totalAmmo[weapon, default: 0] += amount
              }

              func unlockWeapon(_ weapon: WeaponType) {
                  if (ammo[weapon] ?? 0) == 0 { ammo[weapon] = weapon.ammoCapacity }
              }

              // MARK: – Death
              private func animateDeath() {
                  physicsBody = nil
                  run(SKAction.sequence([
                      SKAction.group([
                          SKAction.rotate(byAngle: .pi * 2, duration: 0.45),
                          SKAction.scale(to: 0.05, duration: 0.45),
                          SKAction.fadeOut(withDuration: 0.45)
                      ]),
                      SKAction.removeFromParent()
                  ]))
              }
          }
          SWIFT_EOF

      - name: 📄 Write Nodes/EnemyNode.swift
        run: |
          cat << 'SWIFT_EOF' > ShadowVillage/Sources/Nodes/EnemyNode.swift
          import SpriteKit

          class EnemyNode: SKNode {
              let enemyType: EnemyType
              var health:    CGFloat
              var isAlive:   Bool = true
              var lastAttackTime: TimeInterval = 0

              private var bodyNode:    SKShapeNode!
              private var healthBarBg: SKShapeNode!
              private var healthBar:   SKShapeNode!

              init(type: EnemyType) {
                  self.enemyType = type
                  self.health    = type.maxHealth
                  super.init()
                  buildVisuals()
              }
              required init?(coder: NSCoder) { fatalError() }

              // MARK: – Visuals
              private func buildVisuals() {
                  let r = enemyType.radius

                  bodyNode = SKShapeNode(circleOfRadius: r)
                  bodyNode.fillColor   = enemyType.bodyColor
                  bodyNode.strokeColor = UIColor(white: 0.18, alpha: 1)
                  bodyNode.lineWidth   = 2
                  addChild(bodyNode)

                  // Eyes
                  for xm: CGFloat in [-1, 1] {
                      let eye = SKShapeNode(circleOfRadius: r * 0.17)
                      eye.fillColor   = UIColor(red: 0.95, green: 0.08, blue: 0.08, alpha: 1)
                      eye.strokeColor = .clear
                      eye.position    = CGPoint(x: xm * r * 0.33, y: r * 0.22)
                      addChild(eye)
                  }

                  // Boss crown
                  if enemyType == .boss {
                      let path = CGMutablePath()
                      path.move(to: CGPoint(x: -22, y: r))
                      path.addLine(to: CGPoint(x: -11, y: r + 18))
                      path.addLine(to: CGPoint(x:   0, y: r +  9))
                      path.addLine(to: CGPoint(x:  11, y: r + 18))
                      path.addLine(to: CGPoint(x:  22, y: r))
                      let crown = SKShapeNode(path: path)
                      crown.strokeColor = UIColor(red: 1, green: 0.8, blue: 0, alpha: 1)
                      crown.lineWidth   = 3
                      crown.lineCap     = .round
                      addChild(crown)
                      bodyNode.run(SKAction.repeatForever(SKAction.sequence([
                          SKAction.scale(to: 1.06, duration: 0.5),
                          SKAction.scale(to: 0.94, duration: 0.5)
                      ])))
                  }

                  // Health bar
                  let bw: CGFloat = r * 3
                  healthBarBg = SKShapeNode(rectOf: CGSize(width: bw, height: 5), cornerRadius: 2)
                  healthBarBg.fillColor   = UIColor(red: 0.28, green: 0, blue: 0, alpha: 0.85)
                  healthBarBg.strokeColor = .clear
                  healthBarBg.position    = CGPoint(x: 0, y: r + 9)
                  addChild(healthBarBg)

                  healthBar = SKShapeNode(rectOf: CGSize(width: bw, height: 5), cornerRadius: 2)
                  healthBar.fillColor   = UIColor(red: 0.8, green: 0.08, blue: 0.08, alpha: 1)
                  healthBar.strokeColor = .clear
                  healthBar.position    = CGPoint(x: 0, y: r + 9)
                  addChild(healthBar)

                  // Physics
                  physicsBody = SKPhysicsBody(circleOfRadius: r)
                  physicsBody?.categoryBitMask    = enemyType.physicsCategory
                  physicsBody?.contactTestBitMask = PhysicsCategory.bullet | PhysicsCategory.player
                  physicsBody?.collisionBitMask   = PhysicsCategory.wall | PhysicsCategory.player
                  physicsBody?.allowsRotation     = false
                  physicsBody?.restitution        = 0
                  physicsBody?.friction           = 1

                  zPosition = 9
              }

              // MARK: – Health Bar
              private func refreshHealthBar() {
                  let ratio  = max(0.001, health / enemyType.maxHealth)
                  let bw     = enemyType.radius * 3
                  healthBar.removeFromParent()
                  let nb = SKShapeNode(rectOf: CGSize(width: bw * ratio, height: 5), cornerRadius: 2)
                  nb.fillColor   = ratio > 0.5
                      ? UIColor(red: 0.8, green: 0.08, blue: 0.08, alpha: 1)
                      : UIColor(red: 1.0, green: 0.50, blue: 0.00, alpha: 1)
                  nb.strokeColor = .clear
                  nb.position    = CGPoint(x: -(bw * (1 - ratio)) / 2, y: enemyType.radius + 9)
                  healthBar = nb
                  addChild(healthBar)
              }

              // MARK: – Damage
              func takeDamage(_ amount: CGFloat) {
                  guard isAlive else { return }
                  health -= amount
                  refreshHealthBar()
                  spawnBlood(count: 5)
                  run(SKAction.sequence([
                      SKAction.run { [weak self] in self?.bodyNode.fillColor = .white },
                      SKAction.wait(forDuration: 0.07),
                      SKAction.run { [weak self] in
                          guard let s = self else { return }
                          s.bodyNode.fillColor = s.enemyType.bodyColor
                      }
                  ]))
                  if health <= 0 { isAlive = false; animateDeath() }
              }

              // MARK: – Blood
              private func spawnBlood(count: Int) {
                  for _ in 0..<count {
                      let p = SKShapeNode(circleOfRadius: CGFloat.random(in: 2...5))
                      p.fillColor   = UIColor(red: 0.68, green: 0, blue: 0, alpha: 0.9)
                      p.strokeColor = .clear
                      p.position    = CGPoint(x: CGFloat.random(in: -10...10),
                                              y: CGFloat.random(in: -10...10))
                      p.zPosition   = 13
                      parent?.addChild(p)
                      let a = CGFloat.random(in: 0...CGFloat.pi * 2)
                      let d = CGFloat.random(in: 22...55)
                      p.run(SKAction.sequence([
                          SKAction.group([
                              SKAction.move(by: CGVector(dx: cos(a)*d, dy: sin(a)*d), duration: 0.28),
                              SKAction.fadeOut(withDuration: 0.28),
                              SKAction.scale(to: 0.1, duration: 0.28)
                          ]),
                          SKAction.removeFromParent()
                      ]))
                  }
              }

              // MARK: – Death
              private func animateDeath() {
                  removeAllActions()
                  physicsBody = nil
                  // Blood pool
                  let pool = SKShapeNode(ellipseOf: CGSize(width: enemyType.radius * 3.2,
                                                           height: enemyType.radius * 2))
                  pool.fillColor   = UIColor(red: 0.38, green: 0, blue: 0, alpha: 0.7)
                  pool.strokeColor = .clear
                  pool.position    = position
                  pool.zPosition   = 2
                  parent?.addChild(pool)
                  // Spin out
                  run(SKAction.sequence([
                      SKAction.group([
                          SKAction.rotate(byAngle: .pi * 2, duration: 0.38),
                          SKAction.scale(to: 0.05, duration: 0.38),
                          SKAction.fadeOut(withDuration: 0.38)
                      ]),
                      SKAction.removeFromParent()
                  ]))
              }

              // MARK: – AI Move
              func moveToward(target: CGPoint, dt: TimeInterval) {
                  guard isAlive else { return }
                  let dx = target.x - position.x
                  let dy = target.y - position.y
                  let dist = sqrt(dx*dx + dy*dy)
                  if dist > 6 {
                      let sp = enemyType.speed
                      physicsBody?.velocity = CGVector(dx: dx/dist*sp, dy: dy/dist*sp)
                      zRotation = atan2(dy, dx)
                  } else {
                      physicsBody?.velocity = .zero
                  }
              }

              func canAttack(at time: TimeInterval) -> Bool {
                  return time - lastAttackTime >= enemyType.attackInterval
              }
          }
          SWIFT_EOF

      - name: 📄 Write Nodes/HUDNode.swift
        run: |
