name: 🎮 Build Shadow Village – RE4 Horror Game IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-game:
    name: 🏗 Build iOS Game
    runs-on: macos-14

    steps:
      # ─────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 2. XCODE SETUP
      # ─────────────────────────────────────────────
      - name: 🔧 Select Latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ─────────────────────────────────────────────
      # 3. INSTALL TOOLS
      # ─────────────────────────────────────────────
      - name: 📦 Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      # ─────────────────────────────────────────────
      # 4. CREATE DIRECTORY STRUCTURE
      # ─────────────────────────────────────────────
      - name: 📁 Create Project Directories
        run: |
          mkdir -p ShadowVillage/Sources/Scenes
          mkdir -p ShadowVillage/Sources/Nodes
          mkdir -p ShadowVillage/Resources

      # ─────────────────────────────────────────────
      # 5. WRITE SWIFT SOURCE FILES
      # ─────────────────────────────────────────────

      - name: 📄 Write PhysicsCategory.swift
        run: |
          cat << 'SWIFT_EOF' > ShadowVillage/Sources/PhysicsCategory.swift
          import Foundation

          struct PhysicsCategory {
              static let none:   UInt32 = 0
              static let player: UInt32 = 0x1 << 0
              static let enemy:  UInt32 = 0x1 << 1
              static let bullet: UInt32 = 0x1 << 2
              static let wall:   UInt32 = 0x1 << 3
              static let item:   UInt32 = 0x1 << 4
              static let boss:   UInt32 = 0x1 << 5
          }
          SWIFT_EOF

      - name: 📄 Write AppDelegate.swift
        run: |
          cat << 'SWIFT_EOF' > ShadowVillage/Sources/AppDelegate.swift
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = GameViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT_EOF

      - name: 📄 Write GameViewController.swift
        run: |
          cat << 'SWIFT_EOF' > ShadowVillage/Sources/GameViewController.swift
          import UIKit
          import SpriteKit

          class GameViewController: UIViewController {

              override func loadView() {
                  self.view = SKView(frame: UIScreen.main.bounds)
              }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  guard let skView = view as? SKView else { return }
                  skView.ignoresSiblingOrder = true
                  skView.showsFPS = false
                  skView.showsNodeCount = false
                  skView.showsPhysics = false
                  skView.preferredFramesPerSecond = 60

                  let bounds = UIScreen.main.bounds
                  let w = max(bounds.width, bounds.height)
                  let h = min(bounds.width, bounds.height)
                  let scene = MainMenuScene(size: CGSize(width: w, height: h))
                  scene.scaleMode = .aspectFill
                  skView.presentScene(scene)
              }

              override var prefersStatusBarHidden: Bool { return true }
              override var shouldAutorotate: Bool { return true }
              override var supportedInterfaceOrientations: UIInterfaceOrientationMask { return .landscape }
              override var prefersHomeIndicatorAutoHidden: Bool { return true }
          }
          SWIFT_EOF

      - name: 📄 Write WeaponType.swift
        run: |
          cat << 'SWIFT_EOF' > ShadowVillage/Sources/WeaponType.swift
          import UIKit

          enum WeaponType: String {
              case pistol   = "Handgun"
              case shotgun  = "Shotgun"
              case rifle    = "Rifle"

              var damage: CGFloat {
                  switch self {
                  case .pistol:  return 25
                  case .shotgun: return 18
                  case .rifle:   return 80
                  }
              }

              var fireRate: TimeInterval {
                  switch self {
                  case .pistol:  return 0.25
                  case .shotgun: return 0.80
                  case .rifle:   return 0.45
                  }
              }

              var ammoCapacity: Int {
                  switch self {
                  case .pistol:  return 15
                  case .shotgun: return 8
                  case .rifle:   return 10
                  }
              }

              var bulletSpeed: CGFloat {
                  switch self {
                  case .pistol:  return 620
                  case .shotgun: return 480
                  case .rifle:   return 950
                  }
              }

              var spreadCount: Int {
                  return self == .shotgun ? 5 : 1
              }

              var color: UIColor {
                  switch self {
                  case .pistol:  return UIColor(red: 1.0, green: 0.9, blue: 0.2, alpha: 1)
                  case .shotgun: return UIColor(red: 1.0, green: 0.5, blue: 0.1, alpha: 1)
                  case .rifle:   return UIColor(red: 0.2, green: 0.9, blue: 1.0, alpha: 1)
                  }
              }
          }
          SWIFT_EOF

