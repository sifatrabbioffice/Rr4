          import SpriteKit

          class HUDNode: SKNode {
              private var healthBarBg:  SKShapeNode!
              private var healthBar:    SKShapeNode!
              private var ammoLabel:    SKLabelNode!
              private var weaponLabel:  SKLabelNode!
              private var scoreLabel:   SKLabelNode!
              private var waveLabel:    SKLabelNode!
              private var reloadLabel:  SKLabelNode!
              private var crosshair:    SKShapeNode!
              private var swapButton:   SKNode!
              let barMaxW: CGFloat = 190

              override init() {
                  super.init()
                  zPosition = 200
              }
              required init?(coder: NSCoder) { fatalError() }

              func setup(screenSize s: CGSize) {
                  let l = -s.width  / 2
                  let t =  s.height / 2
                  let r =  s.width  / 2
                  let b = -s.height / 2

                  // ── Health Bar ──────────────────────────
                  let hpBg = SKShapeNode(rectOf: CGSize(width: barMaxW+4, height: 22), cornerRadius: 4)
                  hpBg.fillColor   = UIColor(white: 0, alpha: 0.5)
                  hpBg.strokeColor = UIColor(white: 1, alpha: 0.22)
                  hpBg.position    = CGPoint(x: l + barMaxW/2 + 24, y: t - 34)
                  addChild(hpBg)

                  healthBarBg = SKShapeNode(rectOf: CGSize(width: barMaxW, height: 16), cornerRadius: 3)
                  healthBarBg.fillColor   = UIColor(red: 0.28, green: 0, blue: 0, alpha: 1)
                  healthBarBg.strokeColor = .clear
                  healthBarBg.position    = hpBg.position
                  addChild(healthBarBg)

                  healthBar = SKShapeNode(rectOf: CGSize(width: barMaxW, height: 16), cornerRadius: 3)
                  healthBar.fillColor   = UIColor(red: 0.1, green: 0.82, blue: 0.1, alpha: 1)
                  healthBar.strokeColor = .clear
                  healthBar.position    = hpBg.position
                  addChild(healthBar)

                  let hpIcon = makeLbl("❤️", sz: 13, pos: CGPoint(x: l + 13, y: t - 40))
                  addChild(hpIcon)

                  // ── Ammo ────────────────────────────────
                  ammoLabel = makeLbl("15/60", sz: 22, font: "Courier-Bold",
                                      pos: CGPoint(x: r - 22, y: b + 78),
                                      color: .white, align: .right)
                  addChild(ammoLabel)

                  weaponLabel = makeLbl("[Handgun]", sz: 13, font: "Courier",
                                        pos: CGPoint(x: r - 22, y: b + 57),
                                        color: UIColor(red: 1, green: 0.8, blue: 0.2, alpha: 1),
                                        align: .right)
                  addChild(weaponLabel)

                  // ── Reload label ────────────────────────
                  reloadLabel = makeLbl("RELOADING...", sz: 18, font: "Courier-Bold",
                                        pos: CGPoint(x: r - 22, y: b + 100),
                                        color: UIColor(red: 1, green: 0.5, blue: 0, alpha: 1),
                                        align: .right)
                  reloadLabel.isHidden = true
                  addChild(reloadLabel)

                  // ── Score / Wave ────────────────────────
                  scoreLabel = makeLbl("SCORE: 0", sz: 17, font: "Courier-Bold",
                                       pos: CGPoint(x: 0, y: t - 34),
                                       color: UIColor(red: 1, green: 0.9, blue: 0.2, alpha: 1))
                  addChild(scoreLabel)

                  waveLabel = makeLbl("WAVE 1", sz: 14, font: "Courier-Bold",
                                      pos: CGPoint(x: 0, y: t - 56),
                                      color: UIColor(red: 0.9, green: 0.2, blue: 0.2, alpha: 1))
                  addChild(waveLabel)

                  // ── Crosshair ───────────────────────────
                  let cs: CGFloat = 18
                  let cp = CGMutablePath()
                  cp.move(to: CGPoint(x: -cs, y: 0)); cp.addLine(to: CGPoint(x: -5, y: 0))
                  cp.move(to: CGPoint(x:   5, y: 0)); cp.addLine(to: CGPoint(x: cs, y: 0))
                  cp.move(to: CGPoint(x: 0, y: -cs)); cp.addLine(to: CGPoint(x: 0, y: -5))
                  cp.move(to: CGPoint(x: 0, y:   5)); cp.addLine(to: CGPoint(x: 0, y: cs))
                  crosshair = SKShapeNode(path: cp)
                  crosshair.strokeColor = UIColor(red: 1, green: 0.15, blue: 0.15, alpha: 0.85)
                  crosshair.lineWidth   = 1.5
                  crosshair.isHidden    = true
                  addChild(crosshair)

                  // ── Weapon SWAP button ──────────────────
                  swapButton = SKNode()
                  swapButton.name     = "swap_btn"
                  swapButton.position = CGPoint(x: r - 45, y: b + 34)
                  swapButton.zPosition = 210
                  let sbg = SKShapeNode(rectOf: CGSize(width: 62, height: 28), cornerRadius: 6)
                  sbg.fillColor   = UIColor(red: 0.18, green: 0.18, blue: 0.42, alpha: 0.85)
                  sbg.strokeColor = UIColor(white: 0.55, alpha: 0.45)
                  sbg.lineWidth   = 1.2
                  sbg.name        = "swap_btn"
                  swapButton.addChild(sbg)
                  let sl = makeLbl("SWAP", sz: 11, font: "Courier-Bold",
                                   pos: .zero, color: .white)
                  sl.name = "swap_btn"
                  swapButton.addChild(sl)
                  addChild(swapButton)
              }

              // MARK: – Update
              func update(health: CGFloat, maxHealth: CGFloat,
                          ammo: Int, totalAmmo: Int,
                          weapon: WeaponType, score: Int, wave: Int,
                          isReloading: Bool) {
                  // Health bar
                  let ratio  = max(0, health / maxHealth)
                  let newW   = max(1, barMaxW * ratio)
                  healthBar.removeFromParent()
                  let nb = SKShapeNode(rectOf: CGSize(width: newW, height: 16), cornerRadius: 3)
                  nb.fillColor = ratio > 0.5
                      ? UIColor(red: 0.10, green: 0.82, blue: 0.10, alpha: 1)
                      : ratio > 0.25
                      ? UIColor(red: 0.90, green: 0.60, blue: 0.00, alpha: 1)
                      : UIColor(red: 0.90, green: 0.10, blue: 0.10, alpha: 1)
                  nb.strokeColor = .clear
                  nb.position    = CGPoint(x: healthBarBg.position.x - (barMaxW - newW) / 2,
                                           y: healthBarBg.position.y)
                  healthBar = nb
                  addChild(healthBar)

                  ammoLabel.text      = "\(ammo)/\(totalAmmo)"
                  ammoLabel.fontColor = ammo == 0 ? .red : ammo <= 3 ? .orange : .white
                  weaponLabel.text    = "[\(weapon.rawValue)]"
                  weaponLabel.fontColor = weapon.color
                  scoreLabel.text     = "SCORE: \(score)"
                  waveLabel.text      = "WAVE \(wave)"
                  reloadLabel.isHidden = !isReloading
              }

              func showCrosshair(at pos: CGPoint) {
                  crosshair.position = pos
                  crosshair.isHidden = false
              }
              func hideCrosshair() { crosshair.isHidden = true }

              func showMessage(_ text: String, color: UIColor = .white, duration: TimeInterval = 2.0) {
                  let l = SKLabelNode(fontNamed: "Courier-Bold")
                  l.text      = text
                  l.fontSize  = 26
                  l.fontColor = color
                  l.position  = CGPoint(x: 0, y: 40)
                  l.zPosition = 300
                  l.setScale(0.4)
                  l.alpha = 0
                  addChild(l)
                  l.run(SKAction.sequence([
                      SKAction.group([SKAction.scale(to: 1.15, duration: 0.2),
                                      SKAction.fadeIn(withDuration: 0.2)]),
                      SKAction.scale(to: 1.0, duration: 0.1),
                      SKAction.wait(forDuration: duration - 0.5),
                      SKAction.group([SKAction.fadeOut(withDuration: 0.3),
                                      SKAction.moveBy(x: 0, y: 28, duration: 0.3)]),
                      SKAction.removeFromParent()
                  ]))
              }

              // MARK: – Helper
              private func makeLbl(_ text: String, sz: CGFloat,
                                   font: String = "Courier-Bold",
                                   pos: CGPoint, color: UIColor = .white,
                                   align: SKLabelHorizontalAlignmentMode = .center) -> SKLabelNode {
                  let l = SKLabelNode(fontNamed: font)
                  l.text = text; l.fontSize = sz; l.fontColor = color
                  l.horizontalAlignmentMode = align
                  l.verticalAlignmentMode   = .center
                  l.position = pos
                  return l
              }
          }
