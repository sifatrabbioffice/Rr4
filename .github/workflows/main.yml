name: Build RE4 Survival IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Tools
        run: |
          brew install xcodegen
          gem install xcpretty

      - name: Create Resident Evil 4 Inspired Game
        run: |
          rm -rf RE4Survival
          mkdir -p RE4Survival/Sources/RE4Survival
          cd RE4Survival

          cat > project.yml << 'EOF'
          name: RE4Survival
          options:
            bundleIdPrefix: com.yourname
            deploymentTarget:
              iOS: "17.0"
          targets:
            RE4Survival:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: Sources
                - path: Info.plist
              settings:
                base:
                  PRODUCT_NAME: RE4Survival
                  PRODUCT_BUNDLE_IDENTIFIER: com.yourname.re4survival
                  INFOPLIST_FILE: Info.plist
                  CODE_SIGN_STYLE: Manual
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: NO
                  ENABLE_BITCODE: NO
          EOF

          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>com.yourname.re4survival</string>
            <key>CFBundleName</key><string>RE4 Survival</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIRequiredDeviceCapabilities</key><array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key><array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UILaunchScreen</key><dict/>
          </dict>
          </plist>
          EOF

          cat > Sources/RE4Survival/AppDelegate.swift << 'EOF'
          import UIKit
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
              window = UIWindow(frame: UIScreen.main.bounds)
              window?.rootViewController = GameViewController()
              window?.makeKeyAndVisible()
              return true
            }
          }
          EOF

          cat > Sources/RE4Survival/GameViewController.swift << 'EOF'
          import UIKit
          import SpriteKit

          class GameViewController: UIViewController {
            override func viewDidLoad() {
              super.viewDidLoad()
              let scene = GameScene(size: CGSize(width: 852, height: 393)) // iPhone 15 Pro Max landscape
              let skView = view as! SKView
              skView.showsFPS = true
              skView.showsNodeCount = true
              skView.ignoresSiblingOrder = true
              scene.scaleMode = .aspectFill
              skView.presentScene(scene)
            }
            override var prefersStatusBarHidden: Bool { true }
          }
          EOF

          cat > Sources/RE4Survival/GameScene.swift << 'EOF'
          import SpriteKit
          import AVFoundation

          class GameScene: SKScene, SKPhysicsContactDelegate {
            var player: SKSpriteNode!
            var healthLabel: SKLabelNode!
            var scoreLabel: SKLabelNode!
            var health = 100
            var score = 0
            var isGameOver = false
            var bullets: [SKSpriteNode] = []
            var zombies: [SKSpriteNode] = []

            let playerCategory: UInt32 = 0x1 << 0
            let zombieCategory: UInt32 = 0x1 << 1
            let bulletCategory: UInt32 = 0x1 << 2

            override func didMove(to view: SKView) {
              backgroundColor = SKColor(red: 0.05, green: 0.05, blue: 0.1, alpha: 1.0) // Dark horror feel
              physicsWorld.contactDelegate = self

              // Player (Leon)
              player = SKSpriteNode(color: .blue, size: CGSize(width: 50, height: 60))
              player.position = CGPoint(x: 150, y: size.height/2)
              player.physicsBody = SKPhysicsBody(rectangleOf: player.size)
              player.physicsBody?.isDynamic = true
              player.physicsBody?.categoryBitMask = playerCategory
              addChild(player)

              // UI
              healthLabel = SKLabelNode(text: "Health: 100")
              healthLabel.position = CGPoint(x: 120, y: size.height - 50)
              healthLabel.fontSize = 28
              healthLabel.fontColor = .red
              addChild(healthLabel)

              scoreLabel = SKLabelNode(text: "Score: 0")
              scoreLabel.position = CGPoint(x: size.width - 150, y: size.height - 50)
              scoreLabel.fontSize = 28
              scoreLabel.fontColor = .yellow
              addChild(scoreLabel)

              // Spawn zombies
              run(SKAction.repeatForever(SKAction.sequence([
                SKAction.run(spawnZombie),
                SKAction.wait(forDuration: 1.2)
              ])))

              let tap = UITapGestureRecognizer(target: self, action: #selector(shoot))
              view.addGestureRecognizer(tap)
            }

            @objc func shoot() {
              if isGameOver { return }
              let bullet = SKSpriteNode(color: .yellow, size: CGSize(width: 20, height: 8))
              bullet.position = player.position
              bullet.physicsBody = SKPhysicsBody(rectangleOf: bullet.size)
              bullet.physicsBody?.isDynamic = true
              bullet.physicsBody?.categoryBitMask = bulletCategory
              addChild(bullet)
              bullets.append(bullet)

              let move = SKAction.moveTo(x: size.width + 50, duration: 0.8)
              bullet.run(SKAction.sequence([move, SKAction.removeFromParent()]))
            }

            func spawnZombie() {
              if isGameOver { return }
              let zombie = SKSpriteNode(color: .red, size: CGSize(width: 45, height: 65))
              zombie.position = CGPoint(x: size.width + 50, y: CGFloat.random(in: 80...size.height-80))
              zombie.physicsBody = SKPhysicsBody(rectangleOf: zombie.size)
              zombie.physicsBody?.isDynamic = false
              zombie.physicsBody?.categoryBitMask = zombieCategory
              addChild(zombie)
              zombies.append(zombie)

              let move = SKAction.moveTo(x: -50, duration: 4.0)
              zombie.run(SKAction.sequence([move, SKAction.removeFromParent()]))
            }

            func didBegin(_ contact: SKPhysicsContact) {
              // Bullet hit zombie
              if (contact.bodyA.categoryBitMask == bulletCategory && contact.bodyB.categoryBitMask == zombieCategory) ||
                 (contact.bodyB.categoryBitMask == bulletCategory && contact.bodyA.categoryBitMask == zombieCategory) {
                score += 10
                scoreLabel.text = "Score: \(score)"
                // Remove zombie
                if let node = contact.bodyA.node ?? contact.bodyB.node {
                  node.removeFromParent()
                }
              }

              // Zombie hit player
              if (contact.bodyA.categoryBitMask == playerCategory && contact.bodyB.categoryBitMask == zombieCategory) ||
                 (contact.bodyB.categoryBitMask == playerCategory && contact.bodyA.categoryBitMask == zombieCategory) {
                health -= 20
                healthLabel.text = "Health: \(health)"
                if health <= 0 {
                  gameOver()
                }
              }
            }

            func gameOver() {
              isGameOver = true
              let label = SKLabelNode(text: "YOU DIED\nFinal Score: \(score)")
              label.position = CGPoint(x: size.width/2, y: size.height/2)
              label.fontSize = 60
              label.fontColor = .red
              label.numberOfLines = 0
              addChild(label)
            }

            override func update(_ currentTime: TimeInterval) {
              if isGameOver { return }
              score += 1
              scoreLabel.text = "Score: \(score)"
            }
          }
          EOF

          xcodegen generate
          echo "✅ RE4 Survival Game Created!"

      - name: Build & Export IPA
        run: |
          cd RE4Survival
          mkdir -p build

          xcodebuild clean archive \
            -project RE4Survival.xcodeproj \
            -scheme RE4Survival \
            -destination 'generic/platform=iOS' \
            -archivePath build/RE4Survival.xcarchive \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual 2>&1 | xcpretty

          cat > build/exportOptions.plist << 'EOP'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>development</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          EOP

          xcodebuild -exportArchive \
            -archivePath build/RE4Survival.xcarchive \
            -exportOptionsPlist build/exportOptions.plist \
            -exportPath build 2>&1 | xcpretty

          ls -la build/
          echo "🎉 IPA Generated!"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RE4Survival-IPA
          path: RE4Survival/build/RE4Survival.ipa
